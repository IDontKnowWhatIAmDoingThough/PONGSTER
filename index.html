        function buildPowerUpPickup(type, colorHex, coreGeo) {
            const group = new THREE.Group();

            // Bright core, larger and hotter than before.
            const core = new THREE.Mesh(coreGeo, new THREE.MeshStandardMaterial({
                color: colorHex, emissive: colorHex, emissiveIntensity: 1.2, roughness: 0.2, metalness: 0.6
            }));
            core.scale.setScalar(1.45);
            if (type === 'WIDE_PADDLE') core.rotation.z = Math.PI / 2;
            core.castShadow = true;
            group.add(core);

            // One clean ring orbiting the core.
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(0.85, 0.04, 8, 48),
                new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.85,
                    blending: THREE.AdditiveBlending, depthWrite: false })
            );
            ring.rotation.x = Math.PI / 2.4;
            const ringPivot = new THREE.Group(); ringPivot.add(ring);
            group.add(ringPivot);

            // Icon badge in the middle of the pickup, always facing the camera and drawn over the core.
            const badge = new THREE.Sprite(new THREE.SpriteMaterial({
                map: getPowerUpIconTexture(type, colorHex), transparent: true, depthTest: false, depthWrite: false
            }));
            badge.scale.set(0.95, 0.95, 1);
            badge.position.y = 0;
            badge.renderOrder = 20;
            group.add(badge);

            return { group, parts: { core, ringPivot, badge } };
        }

        function spawnPowerUp(pos) {
            if (powerUps.length >= MAX_ACTIVE_POWERUPS) return;

            // Exclude power-ups that are currently active; once inactive, they become available again.
            // Slow-Mo is reserved for last-life situations so it doesn't slow down regular play.
            const availableTypes = Object.keys(POWERUP_WEIGHTS).filter(t => {
                if (isPowerUpActive(t)) return false;
                if (t === 'SLOW_MO' && lives !== 1) return false;
                return true;
            });
            if (availableTypes.length === 0) return;

            const totalWeight = availableTypes.reduce((sum, t) => sum + POWERUP_WEIGHTS[t], 0);
            let randVal = Math.random() * totalWeight;
            let type = availableTypes[0];

            for (let i = 0; i < availableTypes.length; i++) {
                const t = availableTypes[i];
                if (randVal < POWERUP_WEIGHTS[t]) {
                    type = t;
                    break;
                }
                randVal -= POWERUP_WEIGHTS[t];
            }

            let colorHex = 0xfacc15;
            let geo;

            if (type === 'MULTIBALL') {
                colorHex = 0xfacc15; 
                geo = new THREE.TetrahedronGeometry(0.55);
            } else if (type === 'WIDE_PADDLE') {
                colorHex = 0x38bdf8; 
                geo = new THREE.CylinderGeometry(0.38, 0.38, 0.7, 8);
            } else if (type === 'EXTRA_LIFE') {
                colorHex = 0xec4899; 
                geo = new THREE.OctahedronGeometry(0.52);
            } else if (type === 'FIREBALL') {
                colorHex = 0xff4500;
                geo = new THREE.IcosahedronGeometry(0.52, 1);
            } else if (type === 'SLOW_MO') {
                colorHex = 0x00f0ff;
                geo = new THREE.TorusGeometry(0.36, 0.14, 8, 16);
            } else if (type === 'LASER_PADDLE') {
                colorHex = 0xff0055;
                geo = new THREE.ConeGeometry(0.42, 0.8, 6);
            } else if (type === 'SHIELD') {
                colorHex = 0x10b981;
                geo = new THREE.OctahedronGeometry(0.55);
            }

            const built = buildPowerUpPickup(type, colorHex, geo);
            const mesh = built.group;
            mesh.position.copy(pos);
            scene.add(mesh);

            powerUps.push({
                mesh,
                parts: built.parts,
                phase: Math.random() * Math.PI * 2,
                type,
                colorHex,
                radius: 0.5,
                velocityZ: 8.5
            });
        }

        function activatePowerUp(p) {
            soundFX.playPowerUpSound();

            if (p.type === 'MULTIBALL') {
                const MAX_BALLS = 6;
                if (balls.length > 0) {
                    const mainBall = balls[0];
                    const pos = mainBall.body.position;
                    if (balls.length < MAX_BALLS) {
                        spawnBall(pos, new THREE.Vector3(-12, 3, -22));
                    }
                    if (balls.length < MAX_BALLS) {
                        spawnBall(pos, new THREE.Vector3(12, 3, -22));
                    }
                } else {
                    spawnBall();
                }
                showNotification('Multi-Ball');
            } else if (p.type === 'WIDE_PADDLE') {
                showNotification('Mega Paddle');
                paddleWidthMultiplier = 1.9;
                isWidePaddleActive = true;
                powerUpTimers.WIDE_PADDLE.remaining = powerUpTimers.WIDE_PADDLE.total;
                createPaddle();
            } else if (p.type === 'EXTRA_LIFE') {
                if (lives < MAX_LIVES) {
                    lives++;
                    updateHUD();
                    soundFX.playLifeUp();
                    showNotification('Extra Life');
                }
            } else if (p.type === 'FIREBALL') {
                showNotification('Fireball');
                isFireballActive = true;
                powerUpTimers.FIREBALL.remaining = powerUpTimers.FIREBALL.total;
                if (typeof updateBallVisuals === 'function') updateBallVisuals();
            } else if (p.type === 'SLOW_MO') {
                showNotification('Slow Motion');
                isSlowMoActive = true;
                powerUpTimers.SLOW_MO.remaining = powerUpTimers.SLOW_MO.total;
            } else if (p.type === 'LASER_PADDLE') {
                showNotification('Laser Cannons');
                isLaserPaddleActive = true;
                laserShootCooldown = 0.1;
                powerUpTimers.LASER_PADDLE.remaining = powerUpTimers.LASER_PADDLE.total;
                createPaddle();
            } else if (p.type === 'SHIELD') {
                activateShield();
            }

            createDebrisParticles(p.mesh.position, p.colorHex, 20);
            spawnShockwave(p.mesh.position, p.colorHex);
        }

        function updatePowerUpTimers(dt) {
            if (gameState === 'PLAYING') {
                for (const key in powerUpTimers) {
                    const timer = powerUpTimers[key];
                    if (timer.remaining > 0) {
                        timer.remaining -= dt;
                        if (timer.remaining <= 0) {
                            timer.remaining = 0;
                            // Expiration callbacks
                            if (key === 'FIREBALL') {
                                isFireballActive = false;
                                if (typeof updateBallVisuals === 'function') updateBallVisuals();
                            }
                            if (key === 'WIDE_PADDLE') {
                                isWidePaddleActive = false;
                                paddleWidthMultiplier = 1.0;
                                createPaddle();
                            }
                            if (key === 'SLOW_MO') isSlowMoActive = false;
                            if (key === 'LASER_PADDLE') {
                                isLaserPaddleActive = false;
                                createPaddle();
                            }
                            if (key === 'SHIELD') deactivateShield();
                        }
                    }
                }
            }

            if (!paddle || !paddle.userData || !paddle.userData.gaugeFill) return;

            const gaugeFill = paddle.userData.gaugeFill;
            const gaugeLight = paddle.userData.gaugeLight;
            const gaugeTrack = paddle.userData.gaugeTrack;

            // Find all active timed power-ups
            const activeKeys = Object.keys(powerUpTimers).filter(k => powerUpTimers[k].remaining > 0);

            if (activeKeys.length === 0) {
                gaugeFill.visible = false;
                if (gaugeLight) gaugeLight.intensity = 0;
                if (gaugeTrack) gaugeTrack.material.opacity = 0.25;
                return;
            }

            gaugeFill.visible = true;
            if (gaugeTrack) gaugeTrack.material.opacity = 0.85;

            // Sort by remaining ratio to show the most urgent active power-up
            activeKeys.sort((a, b) => (powerUpTimers[a].remaining / powerUpTimers[a].total) - (powerUpTimers[b].remaining / powerUpTimers[b].total));
            const activeKey = activeKeys[0];
            const active = powerUpTimers[activeKey];

            const ratio = THREE.MathUtils.clamp(active.remaining / active.total, 0.0, 1.0);

            // Deplete loading bar along X axis
            gaugeFill.scale.x = Math.max(ratio, 0.001);

            // Color-coordinated gradient shift (e.g. vibrant gold-orange -> intense fiery red for Fireball)
            const startCol = new THREE.Color(active.color);
            const endCol = new THREE.Color(active.endColor);
            const currentColor = endCol.clone().lerp(startCol, Math.pow(ratio, 0.65));

            gaugeFill.material.color.copy(currentColor);
            gaugeFill.material.emissive.copy(currentColor);

            // Dynamic warning pulse when under 25% time left
            let intensity = 2.4;
            if (ratio < 0.25) {
                const pulse = Math.sin(performance.now() * 0.025);
                intensity = pulse > 0 ? 3.4 : 0.6;
            }

            gaugeFill.material.emissiveIntensity = intensity;

            if (gaugeLight) {
                gaugeLight.color.copy(currentColor);
                gaugeLight.intensity = (intensity / 2.4) * 2.2;
            }
        }

        function updatePowerUps(dt) {
            const paddleBaseY = (paddle && paddle.userData && paddle.userData.height) ? (paddle.userData.height / 2) + 0.18 : 0.54;

            for (let i = powerUps.length - 1; i >= 0; i--) {
                const p = powerUps[i];
                p.mesh.position.z += p.velocityZ * dt;

                // Settle down to paddle height as they travel so they never
                // float over the paddle out of pickup range — they sink into
                // a catchable height instead of sailing past above it.
                if (p.mesh.position.y > paddleBaseY) {
                    p.mesh.position.y += (paddleBaseY - p.mesh.position.y) * 2.4 * dt;
                }

                // Spinning core (peeks out around the badge) and a turning ring.
                p.phase += dt;
                const pu = p.parts;
                pu.core.rotation.y += 3.5 * dt;
                pu.core.rotation.x += 1.5 * dt;
                pu.ringPivot.rotation.y += 2.4 * dt;
                pu.badge.material.opacity = 1;

                if (paddle) {
                    const paddleHalfW = getPaddleHalfWidth();

                    if (
                        Math.abs(p.mesh.position.x - paddle.position.x) < paddleHalfW + p.radius &&
                        Math.abs(p.mesh.position.z - paddle.position.z) < 0.8 &&
                        Math.abs(p.mesh.position.y - paddle.position.y) < 1.0
                    ) {
                        activatePowerUp(p);
                        disposeMesh(p.mesh);
                        powerUps.splice(i, 1);
                        continue;
                    }
                }

                if (p.mesh.position.z > ARENA.paddleZ + 5) {
                    disposeMesh(p.mesh);
                    powerUps.splice(i, 1);
                }
            }

            // High-efficiency pre-allocated point lights track active power-ups with zero GC or shader recompile
            for (let i = 0; i < MAX_POWERUP_LIGHTS; i++) {
                const light = powerUpLightPool[i];
                if (light) {
                    if (i < powerUps.length) {
                        const p = powerUps[i];
                        light.position.copy(p.mesh.position);
                        light.color.setHex(p.colorHex);
                        light.intensity = 3.2;
                    } else {
                        light.intensity = 0;
                    }
                }
            }
        }

        function createPaddleSparks(pos) { emitPooledSparks(pos); }
        function updateSparks(dt) { updatePooledSparks(dt); }


        // PONGSTER — ten authored levels. Coordinates describe real solid shapes.
        const CAMPAIGN_LEVELS = [
            { name: 'HI!', hint: 'Yellow bricks turn red when hit, then break on the next hit. Clear HI! to continue.' },
            { name: 'CORE MELTDOWN', hint: 'A 3 × 3 × 3 stack. Find the explosive at its ground-floor heart.' },
            { name: 'OVER THE WALL', hint: 'Drag up to clear the shorter wall, then break the nine yellow blocks.' },
            { name: 'TIMBER HOUSE', hint: 'Every beam, round column and triangular roof can break. Take out the supports.' },
            { name: 'PONG', hint: 'Classic Pong. The enemy paddle never misses. Hit the white cube in the middle nine times as it shifts through the colors, red is the last before it breaks.' },
            { name: 'DOMINO GARDEN', hint: 'Follow the winding yellow trail. Explosives connect the clusters.' },
            { name: 'TWIN BRIDGES', hint: 'Round piers, long spans, pointed caps. Break the piers to bring the bridges down.' },
            { name: 'RICOCHET COURT', hint: 'Black bumpers never break. Bank your shots into the colorful pockets.' },
            { name: 'SPIRAL VAULT', hint: 'Work around the open spiral or lob into its explosive center.' },
            { name: 'TIMBER SKYLINE', hint: 'Five different buildings. Break the low beams or lob into the rooftops.' },
            { name: 'THE GRAND FINALE', hint: 'Clear the wall. Demolish the mixed-shape city and ignite its explosive ring.' }
        ];
        // Display order of the campaign -> blueprint id. Move 'pong' anywhere in this list to reposition that level.
        const LEVEL_SEQUENCE = [1, 2, 3, 4, 'pong', 5, 6, 7, 8, 9, 10];
        function isPongLevel() { return LEVEL_SEQUENCE[currentLevel - 1] === 'pong'; }
        let activeLevel = null;
        let levelRevision = 0;
        let levelTransitionTimer = null;
        let lobQueued = false;
        let woodTexture = null;
        const targetGeometryCache = new Map();

        function makeLevelBlueprint(displayLevel) {
            const level = LEVEL_SEQUENCE[displayLevel - 1];
            const blocks = [];
            let trap = null;
            let ramp = null;
            const add = (x, y, z, w = 0.84, h = w, d = w, options = {}) => {
                blocks.push({ x, y, z, w, h, d, shape: 'box', type: 'yellow', ...options });
            };
            const cube = (x, z, type = 'yellow', size = 0.84, layer = 0) =>
                add(x, size / 2 + layer * (size + 0.015), z, size, size, size, { type });
            const wood = (x, y, z, w, h, d, shape = 'box') =>
                add(x, y, z, w, h, d, { shape, type: 'wood' });
            const cylinder = (x, z, h = 1.8, type = 'green', diameter = 0.9, base = 0) =>
                add(x, base + h / 2, z, diameter, h, diameter, { shape: 'cylinder', type });
            const wall = (z, layers = 3) => {
                const size = 0.9;
                for (let col = 0; col < 16; col++) {
                    for (let row = 0; row < layers; row++) {
                        add(-6.75 + col * size, size / 2 + row * size, z, size, size, size, { type: 'black' });
                    }
                }
                trap = { z, depth: size, height: layers * size, rear: z - size / 2 };
            };
            const house = (x, z, width = 3.2, floors = 2, postD = 0.62) => {
                const depth = 2.5, postH = 1.3, beamH = 0.36;
                let base = 0;
                for (let floor = 0; floor < floors; floor++) {
                    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
                        cylinder(x + sx * (width / 2 - postD / 2), z + sz * (depth / 2 - postD / 2), postH, 'wood', postD, base);
                    }
                    base += postH;
                    wood(x, base + beamH / 2, z, width, beamH, depth);
                    base += beamH;
                }
                wood(x, base + 0.68, z, width + 0.28, 1.36, depth + 0.18, 'prism');
            };

            switch (level) {
                case 1: {
                    const glyphs = [
                        ['101','101','111','101','101'],
                        ['111','010','010','010','111'],
                        ['010','010','010','000','010']

                    glyphs.forEach((glyph, letter) => glyph.forEach((row, r) => {

                                cube((letter * 4 + c - 4.5) * 0.70, -14.5 + r * 0.78, type, 0.62);

                            (h === 0 || h === 1) && row === 1 && col === 1 ? 'explosive' : 'yellow', 0.94, h);
                    }
                    break;
                case 'pong':

                case 3:

                    wall(-5.5, 2);
                    for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {

                            row === 1 && col !== 1 ? 'explosive' : 'yellow', 0.88);

                case 4:

                    cube(0.7, -13.6, 'explosive', 0.8);

                case 5:

                        add(x, 0.57, z, 0.32, 1.14, 0.30,
                            { type: i % 11 === 5 ? 'explosive' : 'yellow', ry: -Math.cos(i * 0.29) * 0.6 });
                    }
                    for (const [x, z] of [[-4.7,-9.2],[4.4,-14.6],[-4.4,-19.7]]) {

                        for (const sx of [-1,1]) cube(x + sx * 0.75, z + 0.75, 'yellow',0.57);

                case 8:
                    // Open Archimedean spiral; no sealed unbreakable pocket.
                    for (let i = 0; i < 53; i++) {

                    }

                    cube(0,-13.25,'explosive',0.84);
                    for (const x of [-5.7,5.7]) {
                        wood(x,0.75,-8.6,1.25,1.5,1.25,'prism');
                        cube(x,-20.4,'black',0.9);
                    }
                    break;
                case 9:
                    house(-4.4,-10.8,2.3,1);
                    house(0,-12.2,2.6,2);
                    house(4.4,-10.8,2.3,1);
                    house(-3.1,-18.3,2.6,3);
                    house(3.1,-18.3,2.6,2);
                    for (const x of [-3.3,-2.2,2.2,3.3]) cube(x,-7.6,'green',0.78);
                    cube(-1.4,-17.0,'explosive',0.80);
                    cube(1.4,-17.0,'explosive',0.80);
                    break;
                case 10:
                    wall(-5.5);
                    house(-3.8,-15.3,2.5,2);
                    house(3.8,-15.3,2.5,2);
                    house(0,-20.5,2.8,3);
                    for (let i = 0; i < 13; i++) {
                        const a = Math.PI * i / 12;
                        cube(Math.cos(a)*5.5,-10.7+Math.sin(a)*2.25,i%6===0?'explosive':'green',0.80);
                    }
                    for (let r=0;r<3;r++) for (let c=0;c<3;c++) cube((c-1)*0.97,-13.2-r*0.96,'yellow',0.82);
                    cube(0,-15.4,'explosive',0.84);
                    for (const x of [-5.8,5.8]) for (let r=0;r<4;r++) cylinder(x,-17-r*1.55,0.90,'green',0.74);
                    break;
                default: throw new Error('Unknown campaign level: ' + level);
            }
            if (level !== 'pong') enlargeLevelPieces(blocks,level,trap);
            return { ...CAMPAIGN_LEVELS[displayLevel - 1], blocks, trap, ramp };
        }

        function makeWoodTexture() {
            if (woodTexture) return woodTexture;
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ead2a2'; ctx.fillRect(0,0,256,256);
            for (let line=0;line<85;line++) {
                const y=line*3.07;
                ctx.strokeStyle = line%3 ? 'rgba(119,70,40,0.09)' : 'rgba(122,78,32,0.16)';
                ctx.lineWidth = line%4 ? 0.6 : 1.2;
                ctx.beginPath();
                for (let x=0;x<=256;x+=4) {
                    const gy=y+Math.sin(x*.033+line*1.79)*1.4;
                    if (!x) ctx.moveTo(x,gy); else ctx.lineTo(x,gy);
                }
                ctx.stroke();
            }
            woodTexture = new THREE.CanvasTexture(canvas);
            woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;
            return woodTexture;
        }

        function prismData(w,h,d) {
            return {
                vertices: [[-w/2,-h/2,-d/2],[w/2,-h/2,-d/2],[0,h/2,-d/2],[-w/2,-h/2,d/2],[w/2,-h/2,d/2],[0,h/2,d/2]],
                faces: [[0,2,1],[3,4,5],[0,1,4,3],[1,2,5,4],[2,0,3,5]]
            };
        }

        function targetGeometry(spec) {
            const key = `${spec.shape}:${spec.w}:${spec.h}:${spec.d}`;
            if (targetGeometryCache.has(key)) return targetGeometryCache.get(key);
            let geo;
            if (spec.shape === 'cylinder') geo = new THREE.CylinderGeometry(spec.w/2,spec.w/2,spec.h,24);
            else if (spec.shape === 'prism') {
                const {vertices, faces} = prismData(spec.w,spec.h,spec.d);
                const p=[];
                faces.forEach(face => {
                    for(let i=1;i<face.length-1;i++) for(const index of [face[0],face[i],face[i+1]]) p.push(...vertices[index]);
                });
                geo=new THREE.BufferGeometry();
                geo.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
                // Planar grain coordinates for each triangular face, no image dependency.
                const uv=[]; for(let i=0;i<p.length;i+=3) uv.push(p[i]/spec.w+.5,(p[i+1]+p[i+2])/(spec.h+spec.d)+.5);
                geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
                geo.computeVertexNormals();
            } else geo = new THREE.RoundedBoxGeometry(spec.w,spec.h,spec.d,2,Math.min(.045,spec.w*.055,spec.h*.055));
            targetGeometryCache.set(key,geo);
            return geo;
        }

        function addTargetBodyShape(body, spec) {
            if (spec.shape === 'prism') {
                const {vertices,faces}=prismData(spec.w,spec.h,spec.d);
                body.addShape(new CANNON.ConvexPolyhedron(vertices.map(v=>new CANNON.Vec3(...v)),faces));
            } else if (spec.shape === 'cylinder') {
                const q=new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);
                body.addShape(new CANNON.Cylinder(spec.w/2,spec.w/2,spec.h,24),new CANNON.Vec3(),q);
            } else body.addShape(new CANNON.Box(new CANNON.Vec3(spec.w/2,spec.h/2,spec.d/2)));
        }

        function clearTarget(target) {
            target.body.collisionResponse=false;
            world.removeBody(target.body);
            if (target.glowMesh) {
                target.glowMesh.geometry.dispose(); target.glowMesh.material.dispose();
            }
            scene.remove(target.mesh);
            target.mesh.material.dispose();
        }

        // Pong level extras: a white enemy paddle that always returns the ball, plus the dashed centre line.
        let pongExtras = null;
        function clearPongExtras() {
            if (!pongExtras) return;
            disposeMesh(pongExtras.group);
            pongExtras = null;
        }
        function buildPongExtras() {
            const group = new THREE.Group();
            const w = Math.min(3.8, ARENA.width * 0.70), h = 0.72, d = 0.86;
            const white = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.85, roughness: 0.5, metalness: 0 });
            const paddleMesh = new THREE.Mesh(createPaddleGeometry(w, h, d, 0.15), white);
            paddleMesh.position.set(0, h / 2 + 0.18, ARENA.backZ + 2.0);
            group.add(paddleMesh);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for (let x = -ARENA.width + 0.5; x < ARENA.width - 0.3; x += 1.6) {
                const dash = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.22), lineMat);
                dash.position.set(x + 0.45, 0.03, -6.75);
                group.add(dash);
            }
            scene.add(group);
            pongExtras = { group, paddle: paddleMesh, hw: w / 2, depth: d, height: h, offset: 0 };
        }
        function updatePongEnemy(dt) {
            if (!pongExtras || !balls.length) return;
            const e = pongExtras;
            // Track whichever ball is closest to the enemy end (heading its way counts triple).
            let target = balls[0], best = Infinity;
            for (const b of balls) {
                const dist = Math.abs(b.body.position.z - e.paddle.position.z) * (b.body.velocity.z < 0 ? 1 : 3);
                if (dist < best) { best = dist; target = b; }
            }
            const maxX = ARENA.width - e.hw;
            const goal = THREE.MathUtils.clamp(target.body.position.x + e.offset, -maxX, maxX);
            const step = 60 * dt, cur = e.paddle.position.x;
            e.paddle.position.x = cur + THREE.MathUtils.clamp(goal - cur, -step, step);
        }
        // The enemy can never miss: any ball reaching its end (at paddle height) is returned.
        function handleEnemyPaddleHit(b) {
            if (!pongExtras || isBallDocked || gameState !== 'PLAYING') return;
            const e = pongExtras, body = b.body, pos = body.position, vel = body.velocity;
            if (vel.z >= 0 || pos.y > 1.6) return;
            if (simulationTime * 1000 - (b.lastEnemyHitTime || 0) < 80) return;
            const radius = b.radius || 0.5;
            const frontZ = e.paddle.position.z + e.depth / 2;
            if (pos.z - radius > frontZ || pos.z < e.paddle.position.z - e.depth) return;
            b.lastEnemyHitTime = simulationTime * 1000;
            const maxX = ARENA.width - e.hw;
            e.paddle.position.x = THREE.MathUtils.clamp(pos.x, -maxX, maxX);   // snap so the contact looks right
            const normX = (Math.random() * 2 - 1) * 0.75;                      // varied return angles
            const angle = normX * Math.PI * 0.30;
            const speed = THREE.MathUtils.clamp(vel.length(), 24, 36);
            pos.z = frontZ + radius; body.position.z = pos.z;
            body.velocity.set(Math.sin(angle) * speed, 0, Math.abs(Math.cos(angle)) * speed);
            b.isAirborne = false;
            if (b.mesh) b.mesh.position.copy(body.position);
            correctTrailHead(b, body.position);
            const contact = new THREE.Vector3(pos.x, e.paddle.position.y + 0.15, frontZ);
            createPaddleSparks(contact);
            spawnShockwave(contact, 0xffffff);
            soundFX.playPaddleHit(normX);
            e.offset = (Math.random() * 2 - 1) * e.hw * 0.6;
        }

        // Static launch ramp (currently level 3 only): wedge mesh + a tilted box body along its slope.
        let levelRamp = null;
        function clearLevelRamp() {
            if (!levelRamp) return;
            world.removeBody(levelRamp.body);
            disposeMesh(levelRamp.mesh);
            levelRamp = null;
        }
        function buildLevelRamp(spec) {
            const { x, width, zLow, run, height } = spec;
            const slope = Math.hypot(run, height);
            const angle = Math.atan2(height, run);

            // Visual wedge: triangle profile (distance toward -z, height) extruded across the width.
            const shape = new THREE.Shape();
            shape.moveTo(0, 0); shape.lineTo(run, 0); shape.lineTo(run, height); shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: false });
            geo.rotateY(Math.PI / 2);          // profile x -> world -z, extrusion -> world x
            geo.translate(x - width / 2, 0, zLow);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.22, roughness: 0.45, metalness: 0.2
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = mesh.receiveShadow = true;
            const edges = new THREE.LineSegments(
                new THREE.EdgesGeometry(geo),
                new THREE.LineBasicMaterial({ color: 0xfff3c4 })
            );
            mesh.add(edges);
            scene.add(mesh);

            // Physics: a thick box whose top face lies exactly on the slope (thick, so a fast ball cannot tunnel).
            const thickness = 1.0;
            const nY = run / slope, nZ = height / slope;   // slope normal (up, toward the player)
            const body = new CANNON.Body({ mass: 0, material: physicsMaterials.ramp });
            body.addShape(new CANNON.Box(new CANNON.Vec3(width / 2, thickness / 2, slope / 2)));
            body.position.set(
                x,
                height / 2 - nY * thickness / 2,
                zLow - run / 2 - nZ * thickness / 2
            );
            body.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), angle);
            world.addBody(body);

            levelRamp = { mesh, body };
        }

        function spawnTargets() {
            levelRevision++;
            targets.forEach(clearTarget); targets=[]; pongCube=null;
            targetGeometryCache.forEach(geo=>geo.dispose()); targetGeometryCache.clear();
            clearPongExtras();
            rollStageColors();
            buildArena();
            activeLevel=makeLevelBlueprint(currentLevel);
            clearLevelRamp();
            if(activeLevel.ramp) buildLevelRamp(activeLevel.ramp);
            if(isPongLevel()) buildPongExtras();
            if(paddle && paddlePongLook!==isPongLevel()) createPaddle();
            resetLobInput();
            const colors={red:0xef4444,yellow:0xffd60a,green:0x10b981,wood:0xe3bb81,black:0x050609,explosive:0xff0033,pong:0xffffff};
            activeLevel.blocks.forEach(spec=> {
                const isIndestructible=spec.type==='black';
                const isExplosive=spec.type==='explosive';
                const isWood=spec.type==='wood';
                const isPongCube=spec.type==='pong';
                const color=colors[spec.type];
                const mat=new THREE.MeshStandardMaterial({
                    color, map:isWood?makeWoodTexture():null,
                    roughness:isIndestructible?.08:isWood?.7:.23,
                    metalness:isIndestructible?.72:isWood?0:.16,
                    envMap:isIndestructible?chromeEnvTexture:null,
                    envMapIntensity:isIndestructible?1.7:1,
                    emissive:isIndestructible||isWood?0x000000:color,
                    emissiveIntensity:isExplosive?.9:.18
                });
                const mesh=new THREE.Mesh(targetGeometry(spec),mat);
                mesh.position.set(spec.x,spec.y,spec.z);
                mesh.rotation.y=spec.ry||0;
                mesh.castShadow=mesh.receiveShadow=true;
                scene.add(mesh);
                let glowMesh=null;
                if(isExplosive) {
                    glowMesh=new THREE.Mesh(new THREE.BoxGeometry(spec.w*1.18,spec.h*1.18,spec.d*1.18),
                        new THREE.MeshBasicMaterial({color,transparent:true,opacity:.33,depthWrite:false,blending:THREE.AdditiveBlending}));
                    mesh.add(glowMesh);
                }
                const body=new CANNON.Body({mass:isIndestructible?0:isPongCube?PONG_CUBE_MASS:(spec.originalMass??Math.max(.6,spec.w*spec.h*spec.d*2.2)),
                    material:isIndestructible?physicsMaterials.wall:isPongCube?physicsMaterials.pongCube:physicsMaterials.default,
                    linearDamping:isPongCube?.01:.48,angularDamping:isPongCube?.01:.62,allowSleep:!isPongCube});
                addTargetBodyShape(body,spec);
                // The pong cube slides but never tumbles, and never sleeps (its return spring must keep running).
                if(isPongCube) { body.fixedRotation=true; body.updateMassProperties(); }
                body.position.set(spec.x,spec.y,spec.z);
                body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0),spec.ry||0);
                body.sleepSpeedLimit=.15; body.sleepTimeLimit=.7;
                world.addBody(body);
                if(!isIndestructible&&!isPongCube) body.sleep();
                const target={mesh,body,spec,hits:spec.type==='red'?2:spec.type==='yellow'?1:0,isDestroying:false,lastHitTime:-Infinity,
                    isPongCube,home:isPongCube?{x:spec.x,y:spec.y,z:spec.z}:null,isIndestructible,isExplosive,isWood,isTitanium:false,isMystery:false,glowMesh,scalePunch:0,revision:levelRevision};
                mesh.userData.target=target;
                targets.push(target);
                if(isPongCube) pongCube=target;
                body.addEventListener('collide',e=> {
                    if(gameState!=='PLAYING'||target.isDestroying||e.body.material!==physicsMaterials.ball) return;
                    const now=simulationTime*1000;
                    bounceBallOffBlock(e.body,body,e.contact);
                    if(now-target.lastHitTime<100) return;
                    target.lastHitTime=now;
                    if(!target.isIndestructible) e.body.pendingTargetContact=true;
                    e.body.consecutiveWallBounces=0;
                    if(target.isIndestructible) { soundFX.playTitaniumHit(); createPaddleSparks(e.body.position); return; }
                    body.wakeUp(); target.scalePunch=.25;
                    // Regular blocks get an extra knock. The pong cube is nudged by the real contact impulse
                    // instead (an extra kick plus upward pop would make it skate and hop).
                    if(!isPongCube) {
                        const incoming=e.body.preStepVelocity||e.body.velocity;
                        body.velocity.x+=incoming.x*.085;
                        body.velocity.z+=incoming.z*.085;
                        body.velocity.y+=.55;
                    }
                    hitTarget(target,isFireballActive?3:1);
                });
            });
            levelBreakableTotal = targets.filter(t => !t.isIndestructible).length;
            blocksDestroyedThisLevel = 0;
            cameraLevelProgressTarget = 0;
            cameraLevelProgress = 0;
            const title=document.getElementById('level-detail');
            if(title) { title.textContent=`${currentLevel} / ${CAMPAIGN_LEVELS.length} — ${activeLevel.name}`; title.title=activeLevel.hint; }
            if(gameState==='PLAYING') showLevelAnnouncement(currentLevel,activeLevel.name);
        }

        function bounceBallOffBlock(ballBody,targetBody,contact=null) {
            if(!ballBody||!contact) return;
            // Contact normals come from the ACTUAL convex/cylindrical collision surface,
            // not the old hard-coded cube-size XY guess. Apply after Cannon's solver.
            const n=contact.ni.clone();
            if(contact.bi===ballBody) n.scale(-1,n);
            const incoming=ballBody.preStepVelocity||ballBody.velocity;
            const approach=incoming.dot(n);
            if(approach>=-.05) return;
            if(ballBody.pendingBlockBounce&&ballBody.pendingBlockBounce.approach<approach) return;
            const reflected=incoming.clone();
            reflected.x-=2*approach*n.x; reflected.y-=2*approach*n.y; reflected.z-=2*approach*n.z;
            if(ballBody.position.y<=.56&&Math.abs(n.y)<.35) reflected.y=0;
            ballBody.pendingBlockBounce={velocity:reflected,approach};
        }

        // white > gray > black > dark blue > blue > teal > green > orange > red, then the next hit destroys it.
        const PONG_CUBE_COLORS=[0xffffff,0x9ca3af,0x050505,0x1e3a8a,0x3b82f6,0x14b8a6,0x22c55e,0xff8a00,0xef4444];

        // Pong cube physics: a ball hit nudges the cube (about 0.4 units at normal speed, under 0.8 at top speed),
        // then a soft spring eases it back to the centre so it can never wander off the ball's path.
        // Tuning: PONG_CUBE_MASS lower = bigger nudge. SPRING = omega^2, DAMPING = 2*zeta*omega (omega 5, zeta 0.85).
        const PONG_CUBE_MASS = 6;
        const PONG_CUBE_SPRING = 25;
        const PONG_CUBE_DAMPING = 8.5;
        const PONG_CUBE_MAX_OFFSET = 1.2;   // hard safety limit, e.g. several balls hitting at once
        let pongCube = null;
        function steerPongCube(dt) {
            const t = pongCube;
            if (!t || t.isDestroying || t.revision !== levelRevision) return;
            const b = t.body, h = t.home;
            b.velocity.x += (-PONG_CUBE_SPRING * (b.position.x - h.x) - PONG_CUBE_DAMPING * b.velocity.x) * dt;
            b.velocity.z += (-PONG_CUBE_SPRING * (b.position.z - h.z) - PONG_CUBE_DAMPING * b.velocity.z) * dt;
            const ox = b.position.x - h.x, oz = b.position.z - h.z;
            if (Math.abs(ox) > PONG_CUBE_MAX_OFFSET) { b.position.x = h.x + Math.sign(ox) * PONG_CUBE_MAX_OFFSET; if (b.velocity.x * ox > 0) b.velocity.x = 0; }
            if (Math.abs(oz) > PONG_CUBE_MAX_OFFSET) { b.position.z = h.z + Math.sign(oz) * PONG_CUBE_MAX_OFFSET; if (b.velocity.z * oz > 0) b.velocity.z = 0; }
        }
        function refreshTargetDamage(t) {
            if(t.isPongCube) {
                const c=PONG_CUBE_COLORS[Math.min(t.hits,PONG_CUBE_COLORS.length-1)];
                t.mesh.material.color.setHex(c); t.mesh.material.emissive.setHex(c);
                return;
            }
            const color=t.hits>=2?0xef4444:t.hits===1?0xffd60a:0x10b981;
            t.mesh.material.color.setHex(color);
            t.mesh.material.emissive.setHex(t.isWood?0x000000:color);
        }

        function hitTarget(t,damage=1) {
            if(!t||t.isIndestructible||t.isDestroying||t.revision!==levelRevision) return;
            if(t.isExplosive) { explodeTarget(t); return; }
            if(t.isPongCube) {
                // Always exactly one step per hit (fireball included), through PONG_CUBE_COLORS, then destroyed.
                t.hits+=1; score+=1; t.scalePunch=.3;
                updateHUD(); soundFX.playComboScaleNote(currentCombo);
                if(t.hits>=PONG_CUBE_COLORS.length) destroyTarget(t);
                else {
                    refreshTargetDamage(t);
                    soundFX.playTargetHit(Math.min(t.hits,2));
                    createDebrisParticles(t.body.position,PONG_CUBE_COLORS[t.hits],8);
                }
                return;
            }
            t.hits+=damage; score+=damage; t.scalePunch=.3;
            t.body.wakeUp();
            wakeSupportedTargets(t);
            updateHUD(); soundFX.playComboScaleNote(currentCombo);
            if(t.hits>=3) destroyTarget(t);
            else {
                refreshTargetDamage(t);
                soundFX.playTargetHit(t.hits);
                createDebrisParticles(t.body.position,t.hits===1?0xffd60a:0xef4444,5);
            }
        }

        function hasBreakableTargets() { return targets.some(t=>!t.isIndestructible); }
        function checkLevelWon() { if(!hasBreakableTargets()&&!isLevelCompleting&&gameState==='PLAYING') onLevelComplete(); }
        function wakeSupportedTargets(source) { wakeConnectedSupports(source); }

        function destroyTarget(target) {
            if(target.isIndestructible||target.revision!==levelRevision) return;
            const index=targets.indexOf(target); if(index<0) return;
            target.isDestroying=true;
            targets.splice(index,1);
            const color=target.isWood?0xc9995c:0xef4444;
            createDebrisParticles(target.body.position,color,12);
            spawnShockwave(target.body.position,color);
            soundFX.playTargetDestroy(); registerBlockDestroyed(target.body.position);
            if(Math.random()<.10) spawnPowerUp(target.body.position);
            // Immediate collision masking, deferred removal: safe inside a Cannon contact callback.
            target.body.collisionResponse=false; target.body.collisionFilterMask=0;
            scene.remove(target.mesh);
            setTimeout(()=>clearTarget(target),0);
            wakeSupportedTargets(target); checkLevelWon();
        }

        function explodeTarget(target) {
            if(target.isIndestructible||target.revision!==levelRevision) return;
            const index=targets.indexOf(target); if(index<0) return;
            target.isDestroying=true; targets.splice(index,1);
            const blastPos=target.body.position.clone(), revision=levelRevision;
            spawnFireball(blastPos); spawnShockwave(blastPos,0xff0033); spawnShockwave(blastPos,0xffaa00);
            createDebrisParticles(blastPos,0xff0033,20); createDebrisParticles(blastPos,0xffaa00,20);
            soundFX.playExplosion(); triggerScreenShake(.5); score+=5;
            registerBlockDestroyed(blastPos); spawnFloatingScore(blastPos,'+5 BOOM!','#ef4444');
            target.body.collisionResponse=false; target.body.collisionFilterMask=0;
            scene.remove(target.mesh); setTimeout(()=>clearTarget(target),0);
            for(const other of [...targets]) {
                if(other.isIndestructible||other.isDestroying) continue;
                const delta=other.body.position.vsub(blastPos), dist=delta.length();
                if(dist>6.2) continue;
                const factor=Math.pow(1-dist/6.2,1.2);
                other.body.wakeUp();
                const norm=1/Math.max(dist,.1);
                other.body.velocity.x+=delta.x*norm*factor*14;
                other.body.velocity.y+=factor*9+1.5;
                other.body.velocity.z+=delta.z*norm*factor*14;
                other.body.angularVelocity.set(factor*2.4,-factor*2.0,factor*1.7);
                if(other.isExplosive) {
                    const fireChain = () => {
                        if (revision !== levelRevision || !targets.includes(other)) return;
                        if (gameState === 'GAMEOVER' || gameState === 'MENU') return;
                        if (gameState !== 'PLAYING') { setTimeout(fireChain, 100); return; }
                        explodeTarget(other);
                    };
                    setTimeout(fireChain, 65 + dist * 18);
                } else hitTarget(other,1);
            }
            wakeSupportedTargets(target); updateHUD(); checkLevelWon();
        }

        function updateCampaignPhysics(dt) {
            const trap=activeLevel&&activeLevel.trap;
            for(const ball of balls) {
                const body=ball.body,p=body.position,v=body.velocity;
                if(body.pendingBlockBounce) {
                    body.velocity.copy(body.pendingBlockBounce.velocity); body.pendingBlockBounce=null;
                }
                if(!trap||isBallDocked) continue;
                if(!ball.capturedCourtyard && p.z+ball.radius<trap.rear) {
                    ball.capturedCourtyard=true;
                    showNotification('OVER THE WALL — courtyard locked');
                }
                // Once fully over, this tutorial/finale courtyard is one-way. A high
                // ricochet cannot escape back over the wall while targets still remain.
                if(ball.capturedCourtyard && p.z>trap.rear-ball.radius) {
                    p.z=trap.rear-ball.radius-.01;
                    v.z=-Math.max(Math.abs(v.z),10);

        // One InstancedMesh per debris color, allocated lazily and kept for the life of the game.
        // All debris of a given color (there's only a handful of colors in the whole game) share
        // one geometry, one material, and one draw call — instead of every chunk getting its own
        // cloned geometry/material and its own place in the render/shadow passes.
        function getDebrisPool(colorHex) {
            let pool = debrisPools.get(colorHex);
            if (pool) return pool;

            if (!debrisGeo) {
                debrisGeo = new THREE.RoundedBoxGeometry(0.2, 0.2, 0.2, 2, 0.04);
            }

            const mat = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.3,
                emissive: colorHex,
                emissiveIntensity: 0.3
            });

            const mesh = new THREE.InstancedMesh(debrisGeo, mat, DEBRIS_POOL_CAPACITY);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            mesh.castShadow = true;
            mesh.count = 0;
            scene.add(mesh);

            pool = { mesh, capacity: DEBRIS_POOL_CAPACITY, slotToParticle: new Array(DEBRIS_POOL_CAPACITY).fill(null), activeCount: 0 };
            debrisPools.set(colorHex, pool);
            return pool;

        function writeDebrisMatrix(p) {
            _debrisEuler.set(p.rotX, p.rotY, p.rotZ);
            _debrisQuat.setFromEuler(_debrisEuler);
            _debrisScale.setScalar(p.scale);
            _debrisMatrix.compose(p.position, _debrisQuat, _debrisScale);
            p.pool.mesh.setMatrixAt(p.slot, _debrisMatrix);
        }

        function removeDebrisParticle(p) {
            const pool = p.pool;
            const lastSlot = pool.activeCount - 1;
            const moved = pool.slotToParticle[lastSlot];
            if (p.slot !== lastSlot) {
                // Swap the last active instance into the freed slot so instances stay compact
                // at [0, activeCount) — no gaps, no per-frame scan for "which slots are live".
                moved.slot = p.slot;
                pool.slotToParticle[p.slot] = moved;
                writeDebrisMatrix(moved);
            }
            pool.slotToParticle[lastSlot] = null;
            pool.activeCount = lastSlot;
            pool.mesh.count = pool.activeCount;
            pool.mesh.instanceMatrix.needsUpdate = true;
            activeParticleCount--;
        }

        function createDebrisParticles(pos, colorHex, count = 12) {
            const quality=AUTO_QUALITY_LEVELS[autoQuality.tier];
            const budget = Math.min(MAX_PARTICLES,quality.particles) - activeParticleCount;
            count=Math.max(1,Math.round(count*quality.burstScale));
            if (budget <= 0) return;
            if (count > budget) count = budget;

            for (let i = 0; i < count; i++) {
                if (pool.activeCount >= pool.capacity) break; // shouldn't happen given MAX_PARTICLES, but stay safe
                const slot = pool.activeCount;

                const baseScale = 0.75 + Math.random() * 0.5;

                // Balanced, energetic burst around the destroyed block
                const angle = Math.random() * Math.PI * 2;
                const speedXZ = 2.4 + Math.random() * 4.2;
                const vy = 2.8 + Math.random() * 4.0;

                const p = {
                    pool,
                    slot,
                    position: new THREE.Vector3(pos.x, pos.y, pos.z),
                    rotX: Math.random() * Math.PI,
                    rotY: Math.random() * Math.PI,
                    rotZ: Math.random() * Math.PI,
                    scale: baseScale,
                    velocity: new THREE.Vector3(Math.cos(angle) * speedXZ, vy, Math.sin(angle) * speedXZ),
                    rotVelocity: new THREE.Vector3((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10),
                    floorY: 0.14 * baseScale,

                pool.activeCount++;
                pool.mesh.count = pool.activeCount;
                writeDebrisMatrix(p);

                activeParticleCount++;
                particles.push(p);

        function updateParticles(dt) {
            const ballCount = balls.length;
            const touchedPools = new Set();

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt;
                touchedPools.add(p.pool);

                // High-performance ball-to-debris push: punchy, satisfying scatter out of ball's path
                for (let j = 0; j < ballCount; j++) {
                    const b = balls[j];
                    const bPos = b.body.position;
                    const dx = p.position.x - bPos.x;
                    const dz = p.position.z - bPos.z;
                    const distSq = dx * dx + dz * dz;
                    const pushRadius = (b.radius || 0.5) + p.radius + 0.20;
                    if (distSq < pushRadius * pushRadius && distSq > 0.00001) {
                        const dist = Math.sqrt(distSq);
                        const nx = dx / dist;
                        const nz = dz / dist;
                        const overlap = pushRadius - dist;
                        p.position.x += nx * overlap;
                        p.position.z += nz * overlap;

                        const bVel = b.body.velocity;
                        const bSpeed = Math.hypot(bVel.x, bVel.z);
                        const pushMag = Math.max(bSpeed * 0.55, 5.0);

                        p.velocity.x = nx * pushMag + bVel.x * 0.25;
                        p.velocity.z = nz * pushMag + bVel.z * 0.25;
                        p.velocity.y = Math.min(Math.max(p.velocity.y, 0) + 2.0 + Math.random() * 1.5, 5.5);
                        p.rotVelocity.x = (Math.random() - 0.5) * 12;
                        p.rotVelocity.y = (Math.random() - 0.5) * 12;
                        p.rotVelocity.z = (Math.random() - 0.5) * 12;
                        p.bounces = 0;
                    }
                }

                if (p.position.y > p.floorY || p.velocity.y > 0) {
                    p.velocity.y -= 23.0 * dt;
                    // Natural gentle air resistance
                    const airDrag = Math.max(0, 1 - 0.85 * dt);
                    p.velocity.x *= airDrag;
                    p.velocity.z *= airDrag;
                    p.rotX += p.rotVelocity.x * dt;
                    p.rotY += p.rotVelocity.y * dt;
                    p.rotZ += p.rotVelocity.z * dt;
                }

                p.position.addScaledVector(p.velocity, dt);

                if (Math.abs(p.position.x) + p.radius > ARENA.width) {
                    p.position.x = Math.sign(p.position.x) * (ARENA.width - p.radius);
                    p.velocity.x = -p.velocity.x * 0.5;
                    p.rotVelocity.multiplyScalar(0.7);
                }
                if (p.position.z - p.radius < ARENA.backZ) {
                    p.position.z = ARENA.backZ + p.radius;
                    p.velocity.z = Math.abs(p.velocity.z) * 0.95;
                    p.rotVelocity.multiplyScalar(0.7);
                }

                if (p.position.y <= p.floorY) {
                    p.position.y = p.floorY;
                    if (p.bounces < p.maxBounces && Math.abs(p.velocity.y) > 0.8) {
                        p.velocity.y = -p.velocity.y * p.restitution;
                        p.velocity.x *= 0.76;
                        p.velocity.z *= 0.76;
                        p.rotVelocity.multiplyScalar(0.72);

                        p.velocity.x *= groundFriction;
                        p.velocity.z *= groundFriction;
                        p.rotVelocity.multiplyScalar(groundFriction);

                // in an InstancedMesh can't each get their own material opacity, but at this small size
                // and speed the scale-to-zero alone reads identically to the old opacity+scale fade.)
                const fadeTime = p.fadeDuration || 1.0;

                    const progress = Math.max(p.life / fadeTime, 0);
                    p.scale = p.baseScale * Math.max(progress, 0.01);

                    removeDebrisParticle(p);
                    particles.splice(i, 1);
                } else {

                }
            }

            touchedPools.forEach(pool => { pool.mesh.instanceMatrix.needsUpdate = true; });
        }

                });
            });
        }

        function updateControlHint(mode) {
            const hint=document.querySelector('.control-hint');if(!hint)return;
            const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
            if(mode==='docked') {
                const help=touch?'Drag left/right to aim · Drag up for lob power · Release to serve':'Move to aim · Click-drag up for lob power · Release to serve';
                hint.innerText=(activeLevel?activeLevel.hint+'\n':'')+help;
            } else {
                hint.innerText=(config.controlMode==='tilt'?'Drag left/right to tilt':'Drag left/right to steer')+' · Drag up for power · Back down to reduce/cancel';
            }
        }

        function dockNewBall() {
            resetSimulationTiming();
            resetLobInput();
            resetCombo();
            balls.forEach(b => {
                world.remove(b.body);
                disposeBall(b);
            });
            balls = [];

            const paddleW = (paddle && paddle.userData && paddle.userData.width) || 3.8;
            const paddleD = (paddle && paddle.userData && paddle.userData.depth) || 0.78;
            const spawnPos = paddle ? new THREE.Vector3(paddle.position.x, 0.5, paddle.position.z - 1.25) : new THREE.Vector3(0, 0.5, ARENA.paddleZ - 1.25);

            spawnBall(spawnPos, new CANNON.Vec3(0, 0, 0));
            isBallDocked = true;
            updateControlHint('docked');
        }

        function onLevelComplete() {
            beginLevelTransition();
        }

        function releaseBall() {
            if (!isBallDocked || balls.length === 0 || gameState !== 'PLAYING' || isLevelCompleting) return;
            resetSimulationTiming(false,true);
            isBallDocked = false;
            updateControlHint('playing');

            // Launch the ball straight forward cleanly
            const b = balls[0];
            const launchSpeed = 26.0;
            if(lobQueued) {
                b.body.position.y=b.radius+.22;
                const profile=getLobProfile(scoopPower);
                b.body.velocity.set(0,profile.verticalSpeed,-profile.horizontalSpeed);
                b.isAirborne=true; b.lobPower=scoopPower;
                soundFX.playScoop(); consumeLob();
            } else b.body.velocity.set(0,0,-launchSpeed);

            soundFX.playWallHit();
            if (paddle) {
                const launchPoint = new THREE.Vector3(paddle.position.x, paddle.position.y + 0.15, paddle.position.z - 0.4);
                createPaddleSparks(launchPoint);
                spawnShockwave(launchPoint, 0x38bdf8);
                predictiveAimFlash = 1.0;
            }
        }

        function updatePaddlePosition(dt) {
            if (!paddle || !paddleBody) return;
            const prevX = paddle.position.x;
            const prevY = paddle.position.y;

            // Direct mode: paddle tracks input 1:1 (0ms delay / zero lag).
            // Tilt mode: paddle stays fixed at center; the same input tilts the arena instead.
            const maxPaddleX = ARENA.width - getPaddleHalfWidth();
            paddle.position.x = (config.controlMode === 'tilt')
                ? 0
                : THREE.MathUtils.clamp(touchState.targetX, -maxPaddleX, maxPaddleX);

            // Handle forward flick / scoop active timer and visual response
            const isChargingInput = lobQueued;
            if (scoopTimer > 0 || isChargingInput) {
                if (scoopTimer > 0) scoopTimer = Math.max(0, scoopTimer - dt);


                const targetPitch = -0.18 - scoopPower * 0.16; // up to ~20 deg upward wedge
                const targetNudge = -0.25 - scoopPower * 0.25;
                paddlePitch = THREE.MathUtils.lerp(paddlePitch, targetPitch, Math.min(1, 26 * dt));
                paddleNudgeZ = THREE.MathUtils.lerp(paddleNudgeZ, targetNudge, Math.min(1, 26 * dt));
            } else {
                paddlePitch = THREE.MathUtils.lerp(paddlePitch, 0, Math.min(1, 14 * dt));
                paddleNudgeZ = THREE.MathUtils.lerp(paddleNudgeZ, 0, Math.min(1, 14 * dt));
            }
            paddle.position.z = ARENA.paddleZ + paddleNudgeZ;

            // Animate 3D Paddle Hardware Chevrons (7 Chevrons showing lob power: 1 = barely any, 7 = max lob)
            if (paddle.userData && paddle.userData.chevronMats) {
                const now = performance.now();
                const isDisplayingPastLob = (now < lastLobDisplayUntil);
                const isLobArmed = (scoopTimer > 0) || isChargingInput;
                const mats = paddle.userData.chevronMats;

                if (isDisplayingPastLob || isLobArmed) {
                    const power = isDisplayingPastLob ? lastLobPower : scoopPower;
                    // Map selected power [0.00, 1.00] to 1..7 filled chevrons
                    const powerRatio = THREE.MathUtils.clamp(power, 0.0, 1.0);
                    const activeCount = THREE.MathUtils.clamp(1 + Math.floor(powerRatio * 6.999), 1, 7);

                    // Order starting from center (index 3) and expanding outward:
                    // 1: [3] (Center)
                    // 2: [3, 4] (Center + Right 1)
                    // 3: [2, 3, 4] (Center + Left 1 + Right 1)
                    // 4: [2, 3, 4, 5] (Center + Left 1 + Right 1 + Right 2)
                    // 5: [1, 2, 3, 4, 5] (Center + Left 1,2 + Right 1,2)
                    // 6: [1, 2, 3, 4, 5, 6] (Center + Left 1,2 + Right 1,2,3)
                    // 7: [0, 1, 2, 3, 4, 5, 6] (All 7 filled in: Max Lob)
                    const centerOutOrder = [3, 4, 2, 5, 1, 6, 0];
                    const activeIndices = new Set(centerOutOrder.slice(0, activeCount));
                    const pulse = 0.82 + Math.sin(now * 0.015) * 0.18;

                    for (let i = 0; i < mats.length; i++) {
                        if (activeIndices.has(i)) {
                            const isLatest = (i === centerOutOrder[activeCount - 1]);
                            mats[i].opacity = Math.min(1.0, pulse + (isLatest ? 0.14 : 0.0));
                        } else {
                            mats[i].opacity = 0.06;
                        }
                    }
                } else {
                    for (let i = 0; i < mats.length; i++) {
                        mats[i].opacity = THREE.MathUtils.lerp(mats[i].opacity, 0.06, Math.min(1, 14 * dt));
                    }
                }
            }

            // Match vertical (Y) position to airborne balls only during active gameplay (not when docked/paused)
            const BASE_PADDLE_Y = (paddle && paddle.userData && paddle.userData.height ? (paddle.userData.height / 2) + 0.18 : 0.54);
            const PROXIMITY_RANGE = 9.5;
            let targetY = BASE_PADDLE_Y;

            if (!isBallDocked && gameState === 'PLAYING' && balls.length > 0) {
                let closestBall = null;
                let minZDist = Infinity;

                for (let i = 0; i < balls.length; i++) {
                    const b = balls[i];
                    const distZ = paddle.position.z - b.mesh.position.z;
                    // Only consider airborne balls that are approaching the paddle (vel.z > 0)
                    if (b.body.velocity && b.body.velocity.z > 0 && distZ > 0.2 && distZ < minZDist && b.mesh.position.y > BASE_PADDLE_Y + 0.05) {
                        minZDist = distZ;
                        closestBall = b;
                    }
                }

                if (closestBall && minZDist <= PROXIMITY_RANGE) {
                    const proximityFactor = THREE.MathUtils.clamp(1.0 - (minZDist / PROXIMITY_RANGE), 0.0, 1.0);
                    const smoothLift = proximityFactor * proximityFactor * (3 - 2 * proximityFactor);
                    const ballElevation = THREE.MathUtils.clamp(closestBall.mesh.position.y, BASE_PADDLE_Y, ARENA.height - 0.4);
                    targetY = THREE.MathUtils.lerp(BASE_PADDLE_Y, ballElevation, smoothLift);
                }
            }

            paddle.position.y += (targetY - paddle.position.y) * Math.min(1,28*dt);

            const safeDt = Math.max(dt, 0.001);
            const instantVelX = (paddle.position.x - prevX) / safeDt;
            touchState.velocityX = THREE.MathUtils.lerp(touchState.velocityX, instantVelX, 0.75);
            touchState.velocityY = (paddle.position.y - prevY) / safeDt;
            touchState.velocityZ = (paddle.position.z - ARENA.paddleZ) / safeDt;

            paddleBody.position.copy(paddle.position);
            paddleBody.velocity.set(0, 0, 0); // Kept zero so Cannon solver doesn't inject kinematic velocity impulses

            paddle.rotation.z = THREE.MathUtils.clamp(-touchState.velocityX * 0.005, -0.22, 0.22);
            paddle.rotation.x = paddlePitch;
            paddleBody.quaternion.set(0, 0, 0, 1); // Physics body remains strictly level (banking is visual-only)

            // Keep docked ball grounded and pinned cleanly in front of the paddle (no intersection)
            if (isBallDocked && balls.length > 0) {
                const b = balls[0];
                b.body.position.set(paddle.position.x, b.radius || 0.5, paddle.position.z - 1.25);
                b.body.velocity.set(0, 0, 0);
                if (b.spin) b.spin.set(0, 0, 0);
                b.mesh.position.copy(b.body.position);
                if (b.shadowMesh) {
                    b.shadowMesh.position.set(b.body.position.x, 0.02, b.body.position.z);
                    b.shadowMesh.scale.set(1, 1, 1);
                    b.shadowMesh.material.opacity = 0.60;
                }
            }
        }

        function updateGameLogic(dt) {
            if(gameState!=='PLAYING'||isLevelCompleting) return;
            updatePowerUps(dt);
            updatePongEnemy(dt);
            updateComboTimer(dt);

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                if (!t.isIndestructible && t.body.sleepState !== CANNON.Body.SLEEPING) {
                    t.mesh.position.copy(t.body.position);
                    t.mesh.quaternion.copy(t.body.quaternion);
                }

                // Target hit reaction scale punch decay
                if (t.scalePunch > 0) {
                    t.scalePunch = Math.max(0, t.scalePunch - dt * 4.5);
                    const punch = 1.0 + Math.sin(t.scalePunch * Math.PI) * 0.22;
                    t.mesh.scale.set(punch, punch, punch);
                } else if (t.mesh.scale.x !== 1) {
                    t.mesh.scale.set(1, 1, 1);
                }

                // Pulsing glow animation for explosive & mystery cubes
                if (t.isExplosive && t.glowMesh) {
                    const pulse = 0.30 + Math.sin(performance.now() * 0.004) * 0.20;
                    t.glowMesh.material.opacity = pulse;
                    t.mesh.material.emissiveIntensity = 0.7 + Math.sin(performance.now() * 0.005) * 0.35;
                } else if (t.isMystery && t.glowMesh) {
                    const pulse = 0.32 + Math.sin(performance.now() * 0.006) * 0.22;
                    t.glowMesh.material.opacity = pulse;
                }

                const pos = t.body.position;
                if (!t.isIndestructible && !t.isDestroying && (Math.abs(pos.x) > ARENA.width + 1.2 || pos.z < ARENA.backZ - 4 || pos.z > ARENA.paddleZ + 3 || pos.y < -3)) {
                    score += 1;
                    updateHUD();

                    createDebrisParticles(t.body.position, 0xef4444, 10);
                    soundFX.playTargetDestroy();
                    registerBlockDestroyed(t.body.position);

                    if (t.glowMesh) {
                        if (t.glowMesh.geometry) t.glowMesh.geometry.dispose();
                        if (t.glowMesh.material) t.glowMesh.material.dispose();
                    }
                    t.body.collisionResponse = false;
                    world.remove(t.body);
                    scene.remove(t.mesh);
                    if (t.mesh.material) t.mesh.material.dispose();
                    targets.splice(i, 1);
                    wakeSupportedTargets(t);

                    if (!hasBreakableTargets() && !isLevelCompleting) {
                        onLevelComplete();
                    }
                }
            }

            if (isBallDocked) {
                return;
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                b.mesh.position.copy(b.body.position);

                const pos = b.body.position;
                const vel = b.body.velocity;

                // 1. Natural Ballistic Mesh Roll (Restores authentic rolling black sphere)
                b.mesh.rotation.x += (vel.z * 1.5) * dt;
                b.mesh.rotation.z -= (vel.x * 1.5) * dt;
                b.mesh.scale.set(1, 1, 1);

                // Dynamic ground contact shadow (stays on the floor beneath the ball)
                const elevation = Math.max(0, pos.y - b.radius);
                if (b.shadowMesh) {
                    b.shadowMesh.position.set(pos.x, 0.02, pos.z);
                    const shadowScale = Math.max(0.35, 1.0 - elevation * 0.16);
                    b.shadowMesh.scale.set(shadowScale, shadowScale, shadowScale);
                    b.shadowMesh.material.opacity = Math.max(0.12, 0.60 - elevation * 0.12);
                }

                // 2. Table Flight Constraint (Allows lofted parabolas while keeping table rolling smooth)
                // ONLY clamp to the floor when falling or stationary vertically (vel.y <= 0)
                if (vel.y <= 0 && pos.y - b.radius <= 0.04) {
                    if (b.isAirborne && vel.y < -1.5) {
                        soundFX.playBallLand();
                        spawnShockwave(new THREE.Vector3(pos.x, 0.04, pos.z), 0x22e5ff);
                        b.isAirborne = false;
                    }
                    pos.y = b.radius;
                    b.body.position.y = pos.y;
                    vel.y = 0;
                } else if (pos.y > 10.5) {
                    pos.y = 10.5;
                    b.body.position.y = 10.5;
                    if (vel.y > 0) vel.y = 0;
                } else if (pos.y > b.radius + 0.08) {
                    b.isAirborne = true;
                }

                // 3. Side Wall Bounces (Exact Specular Reflection)
                const boundX = ARENA.width - b.radius;
                if (pos.x <= -boundX) {
                    pos.x = -boundX;
                    b.body.position.x = pos.x;
                    if (vel.x < 0) {
                        vel.x = Math.abs(vel.x);
                        b.consecutiveWallBounces = (b.consecutiveWallBounces || 0) + 1;
                        if (b.consecutiveWallBounces >= 5 && Math.abs(vel.z) < 0.6) {
                            vel.z = (vel.z >= 0 ? 1.2 : -1.2);
                        }
                        createPaddleSparks(pos);
                        soundFX.playWallHit();
                    }
                } else if (pos.x >= boundX) {
                    pos.x = boundX;
                    b.body.position.x = pos.x;
                    if (vel.x > 0) {
                        vel.x = -Math.abs(vel.x);
                        b.consecutiveWallBounces = (b.consecutiveWallBounces || 0) + 1;
                        if (b.consecutiveWallBounces >= 5 && Math.abs(vel.z) < 0.6) {
                            vel.z = (vel.z >= 0 ? 1.2 : -1.2);
                        }
                        createPaddleSparks(pos);
                        soundFX.playWallHit();
                    }
                }

                // 4. Back Wall Bounce (Exact Specular Reflection)
                const boundZ = ARENA.backZ + b.radius;
                if (pos.z <= boundZ) {
                    pos.z = boundZ;
                    b.body.position.z = pos.z;
                    if (vel.z < 0) {
                        vel.z = Math.abs(vel.z);
                        b.consecutiveWallBounces = 0;
                        createPaddleSparks(pos);
                        soundFX.playWallHit();
                    }
                }

                // 5. Anti-Deadlock Micro-Threshold (only if z speed is virtually dead)
                if (Math.abs(vel.z) < 0.05) {
                    vel.z = (vel.z >= 0 ? 0.8 : -0.8);
                }

                // 6. Continuous Paddle Collision Check
                handlePaddleHit(b);
                handleEnemyPaddleHit(b);

                // 7. Dynamic Speed Envelope (modulated by Slow-Mo power-up, Tilt control mode,
                //    and the level-complete cinematic timeScale so this clamp doesn't yank
                //    ball speed back up while a slow-mo effect is playing)
                let minSpeed, maxSpeed;
                if (isSlowMoActive) {
                    minSpeed = 6; maxSpeed = 11;
                } else if (config.controlMode === 'tilt') {
                    minSpeed = 11; maxSpeed = 20;
                } else {
                    minSpeed = 18; maxSpeed = 38;
                }
                minSpeed *= timeScale;
                maxSpeed *= timeScale;
                const currentSpeed = b.isAirborne ? Math.hypot(vel.x,vel.z) : vel.length();
                if (currentSpeed < minSpeed) {
                    const scale = minSpeed / Math.max(currentSpeed, 0.01);
                    vel.x *= scale;
                    if(!b.isAirborne) vel.y *= scale;
                    vel.z *= scale;
                } else if (currentSpeed > maxSpeed) {
                    const scale = maxSpeed / currentSpeed;
                    vel.x *= scale;
                    if(!b.isAirborne) vel.y *= scale;
                    vel.z *= scale;
                }

                // Sync 3D mesh position cleanly with updated physics body position
                b.mesh.position.copy(b.body.position);

                // Ball out of bounds (past player paddle)
                if (pos.z > ARENA.paddleZ + 4) {
                    world.remove(b.body);
                    disposeBall(b);
                    balls.splice(i, 1);

                    if (balls.length === 0) {
                        lives -= 1;
                        updateHUD();
                        soundFX.playBallLost();
                        if (lives > 0) {
                            dockNewBall();
                        } else {
                            gameOver();
                        }
                    }
                }
            }
        }

        function render() {
            applyViewportResize();
            updateLobIndicator();
            flushHUD();
            renderer.render(scene, camera);
        }

        let previousLives = 3;
        function renderHearts(count, changedIndex = -1, isLoss = false) {
            const container = document.getElementById('lives-hearts-row');
            if (!container) return;
            const key=count+':'+changedIndex+':'+isLoss;
            if(key===lastHeartState)return;
            lastHeartState=key;
            const maxSlots = Math.max(3, Math.min(count, 5));
            let html = '';
            for (let i = 0; i < maxSlots; i++) {
                const isAlive = i < count;
                let slotClass = 'heart-slot';
                if (isAlive) slotClass += ' active';
                else slotClass += ' lost';

                if (count === 1 && isAlive) slotClass += ' critical';
                if (isLoss && i === count) slotClass += ' just-broken';
                if (!isLoss && changedIndex === i) slotClass += ' just-gained';

                html += `
                    <div class="${slotClass}" data-index="${i}" title="${isAlive ? 'Life active' : 'Life lost'}">
                        <svg viewBox="0 0 24 24" class="heart-svg" aria-hidden="true">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>
                `;
            }
            if (count > 5) {
                html += `<span class="extra-lives-badge">+${count - 5}</span>`;
            }
            container.innerHTML = html;
        }

        function updateHUD(forceReset=false) { markHUDDirty(forceReset); }

        function renderHUD(forceReset = false) {
            const scoreEl = document.getElementById('score-val');
            if (scoreEl) {
                const prevVal = scoreEl.innerText;
                scoreEl.innerText = score;
                if (prevVal !== String(score)) {
                    scoreEl.classList.remove('score-pop');
                    requestAnimationFrame(() => {
                        scoreEl.classList.add('score-pop');
                    });
                }
            }

            if (score > highScore) {
                highScore = score;
            }
            const bestEl = document.getElementById('best-score-val');
            if (bestEl) bestEl.innerText = highScore;

            const levelBadgeEl = document.getElementById('level-badge-num');
            if (levelBadgeEl) levelBadgeEl.innerText = currentLevel;

            // Animated glowing SVG hearts
            const isLoss = !forceReset && lives < previousLives;
            const isGain = !forceReset && lives > previousLives;
            renderHearts(lives, isGain ? lives - 1 : -1, isLoss);
            previousLives = lives;

            const levelEl = document.getElementById('level-val');
            if (levelEl) {
                levelEl.innerText = `Level ${currentLevel} • ${lives} Lives`;
            }

            // Danger Vignette on 1 life remaining
            const dangerVignette = document.getElementById('danger-vignette');
            if (dangerVignette) {
                if (lives === 1 && gameState === 'PLAYING') {
                    dangerVignette.classList.add('active-vignette');
                } else {
                    dangerVignette.classList.remove('active-vignette');
                }
            }

            checkMilestones();
        }

        function startGame() {
            resetSimulationTiming(true);
            levelTransitionRemaining=0;
            settingsReturnState='PAUSED';
            if(levelTransitionTimer) clearTimeout(levelTransitionTimer);
            levelRevision++;
            // Hide all screens immediately so the player sees the game
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('pause-screen')?.classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('settings-screen').classList.add('hidden');

            soundFX.init();
            soundFX.resumeBgm();
            resetCombo();
            unlockedMilestones.clear();
            sessionMaxCombo = 0;
            score = 0;
            lives = 3;
            previousLives = 3;
            currentLevel = 1;
            paddleWidthMultiplier = 1.0;
            timeScale = 1.0;
            isBallDocked = false;
            isLevelCompleting = false;
            currentTiltAngle = 0;
            currentTiltForce = 0;
            world.gravity.set(0, -BASE_GRAVITY_MAGNITUDE, 0);

            const dangerVignette = document.getElementById('danger-vignette');
            if (dangerVignette) dangerVignette.classList.remove('active-vignette');

            for (const key in powerUpTimers) {
                powerUpTimers[key].remaining = 0;
            }
            isFireballActive = false;
            isSlowMoActive = false;
            isLaserPaddleActive = false;
            isWidePaddleActive = false;
            deactivateShield();

            laserBolts.forEach(b => disposeMesh(b.mesh));
            laserBolts = [];

            flameEmbers.forEach(e => disposeMesh(e.mesh));
            flameEmbers = [];

            if (predictiveAimPointer) {
                predictiveAimPointer.visible = false;
                predictiveAimFlash = 0;
            }

            if (typeof updateControlHint === 'function') updateControlHint('docked');
            updateHUD(true);

            balls.forEach(b => {
                world.remove(b.body);
                disposeBall(b);
            });
            balls = [];

            powerUps.forEach(p => disposeMesh(p.mesh));
            powerUps = [];
            powerUpLightPool.forEach(l => l.intensity = 0);

            debrisPools.forEach(pool => {
                pool.activeCount = 0;
                pool.mesh.count = 0;
                pool.slotToParticle.fill(null);
                pool.mesh.instanceMatrix.needsUpdate = true;
            });
            particles = [];
            activeParticleCount = 0;

            clearPooledSparks();

            shockwaves.forEach(sw => disposeMesh(sw.mesh));
            shockwaves = [];

            gameState = 'PLAYING';
            createPaddle();
            spawnTargets();
            dockNewBall();
        }

        function gameOver(victory=false) {
            resetSimulationTiming();
            levelTransitionRemaining=0;isLevelCompleting=false;timeScale=1;
            gameState = 'GAMEOVER';
            resetLobInput();
            document.querySelector('#gameover-screen .title').textContent= victory ? `All ${CAMPAIGN_LEVELS.length} levels cleared` : 'Game Over';
            document.querySelector('#gameover-screen .subtitle').textContent= victory ? 'PONGSTER campaign complete' : 'Session Summary';
            resetCombo();
            soundFX.playGameOver();
            soundFX.stopBgm();
            saveHighScores();

            const dangerVignette = document.getElementById('danger-vignette');
            if (dangerVignette) dangerVignette.classList.remove('active-vignette');

            const finalScoreEl = document.getElementById('final-score-val');
            const finalBestEl = document.getElementById('final-best-val');
            const finalLevelEl = document.getElementById('final-level-val');
            if (finalScoreEl) finalScoreEl.innerText = score;
            if (finalBestEl) finalBestEl.innerText = highScore;
            if (finalLevelEl) finalLevelEl.innerText = currentLevel;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        function onWindowResize() {
            viewportResizePending=true;
        }


        window.onload = () => {
            initEngine();
        };
    </script>
