<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PONGSTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #22e5ff;
            --neon-cyan-soft: #7de8ff;
            --neon-magenta: #ff2ea6;
            --neon-orange: #ff7a1a;
            --neon-yellow: #ffd60a;
            --neon-red: #ff3b5c;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse 120% 90% at 50% 0%, #141032 0%, #05060c 55%, #05060c 100%);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphic UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        }

        .interactive {
            pointer-events: auto;
        }

        /* Minimalist HUD Header */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 100%;
            gap: 12px;
            box-sizing: border-box;
        }

        .stat-box {
            background: linear-gradient(160deg, rgba(20, 16, 40, 0.35), rgba(10, 12, 20, 0.35));
            backdrop-filter: blur(26px);
            -webkit-backdrop-filter: blur(26px);
            border: 1px solid rgba(34, 229, 255, 0.25);
            border-radius: 14px;
            padding: 6px 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), 0 0 18px rgba(34, 229, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            flex-shrink: 1;
            min-width: 0;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .hud-stat-box {
            min-width: 0;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .score-subcol, .best-subcol {
            display: flex;
            flex-direction: column;
        }

        .best-subcol {
            text-align: right;
        }

        .best-label {
            color: rgba(255, 214, 10, 0.55) !important;
        }

        .best-val {
            color: #ffd60a !important;
            font-size: 14px !important;
            text-shadow: 0 0 10px rgba(255, 214, 10, 0.5);
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: rgba(125, 232, 255, 0.65);
            font-weight: 600;
            margin-bottom: 1px;
        }

        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(34, 229, 255, 0.65);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            display: inline-block;
            transition: transform 0.12s ease-out;
        }

        .score-pop {
            animation: scorePopAnim 0.18s ease-out;
        }

        @keyframes scorePopAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: var(--neon-cyan-soft); }
            100% { transform: scale(1); }
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .menu-btn {
            background: linear-gradient(160deg, rgba(20, 16, 40, 0.35), rgba(10, 12, 20, 0.35));
            backdrop-filter: blur(26px);
            -webkit-backdrop-filter: blur(26px);
            border: 1px solid rgba(34, 229, 255, 0.2);
            border-radius: 12px;
            width: 36px;
            height: 36px;
            padding: 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .menu-btn:hover {
            background: rgba(34, 229, 255, 0.12);
            border-color: rgba(34, 229, 255, 0.5);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), 0 0 16px rgba(34, 229, 255, 0.35);
            transform: translateY(-1px);
        }

        .menu-btn:active {
            transform: scale(0.94);
            background: rgba(34, 229, 255, 0.2);
        }

        /* Dedicated Lives & Level Pod */
        .lives-stat-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 0;
            text-align: right;
        }

        .lives-top-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 2px;
        }

        .lives-top-row .stat-label {
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 0;
        }

        .lives-level-num {
            color: var(--neon-magenta);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 46, 166, 0.55);
        }

        .lives-hearts-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            min-height: 20px;
        }

        .heart-slot {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .heart-svg {
            width: 100%;
            height: 100%;
            display: block;
            transition: all 0.2s ease;
        }

        /* Active Heart - Minimalist solid coral */
        .heart-slot.active .heart-svg {
            fill: #ff3b5c;
            filter: drop-shadow(0 2px 6px rgba(255, 59, 92, 0.4));
        }

        /* Lost Heart - Clean subtle outline */
        .heart-slot.lost .heart-svg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.22);
            stroke-width: 1.8;
            stroke-linejoin: round;
            stroke-linecap: round;
            filter: none;
            opacity: 0.5;
        }

        /* Danger pulse when at 1 life */
        .heart-slot.critical {
            animation: heartThump 1.0s infinite ease-in-out;
        }

        .heart-slot.critical .heart-svg {
            fill: #ef4444;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8));
        }

        .heart-slot.just-gained {
            animation: heartPopIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        .heart-slot.just-broken {
            animation: heartShatter 0.35s ease-out forwards;
        }

        .extra-lives-badge {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #ff3b5c;
            background: rgba(255, 59, 92, 0.12);
            border: 1px solid rgba(255, 59, 92, 0.25);
            border-radius: 4px;
            padding: 0 3px;
            margin-left: 2px;
        }

        @keyframes heartThump {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(1.15); }
        }

        @keyframes heartPopIn {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.25); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes heartShatter {
            0% { transform: scale(1.15); }
            50% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        /* Minimal Screen Modals & Cards */
        .screen-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 15%, rgba(34, 229, 255, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(255, 46, 166, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(255, 122, 26, 0.12) 0%, transparent 50%),
                rgba(5, 6, 12, 0.78);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
            transition: opacity 0.25s ease;
        }

        .screen-modal.hidden {
            display: none;
        }

        .modal-card {
            position: relative;
            background: linear-gradient(165deg, rgba(20, 17, 36, 0.9), rgba(10, 11, 18, 0.92));
            border: 1px solid rgba(34, 229, 255, 0.25);
            border-radius: 24px;
            padding: 36px 32px;
            max-width: 380px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02), 0 0 50px rgba(34, 229, 255, 0.08), 0 0 80px rgba(255, 46, 166, 0.06);
        }

        /* Settings Modal */
        .custom-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 10%, rgba(34, 229, 255, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(255, 46, 166, 0.12) 0%, transparent 45%),
                rgba(5, 6, 12, 0.88);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 30;
            padding: max(32px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
            transition: opacity 0.2s ease;
            overflow-y: auto;
        }

        .custom-modal.hidden {
            display: none;
        }

        /* The global touch-action:none (needed so paddle-drag gestures don't scroll/zoom
           the page) would otherwise also block scrolling this modal on touch devices when
           its content is taller than the screen. Explicitly re-allow vertical panning here. */
        #settings-screen, #settings-screen * {
            touch-action: pan-y;
        }

        .custom-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }

        .custom-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .custom-group {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.15s ease;
        }

        .custom-group:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .custom-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* Segmented Controls - Ultra Clean Apple style */
        .select-row {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            padding: 2px;
            border-radius: 10px;
            gap: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .opt-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.45);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .opt-btn:hover {
            color: #ffffff;
        }

        .opt-btn.active {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            color: #05060c;
            box-shadow: 0 0 14px rgba(34, 229, 255, 0.4);
            font-weight: 700;
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(32px, 8vw, 44px);
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--neon-cyan) 0%, var(--neon-magenta) 50%, var(--neon-orange) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 18px rgba(34, 229, 255, 0.45)) drop-shadow(0 0 34px rgba(255, 46, 166, 0.3));
            margin-bottom: 8px;
            line-height: 1.1;
            animation: titleFlicker 2.6s ease-in-out infinite;
        }

        @keyframes titleFlicker {
            0%, 92%, 100% { opacity: 1; }
            94% { opacity: 0.86; }
            96% { opacity: 1; }
            97% { opacity: 0.9; }
        }

        .subtitle {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 24px;
            max-width: 300px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Vivid Primary Action Button */
        .btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #05060c;
            padding: 12px 34px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(34, 229, 255, 0.35), 0 4px 20px rgba(255, 46, 166, 0.25);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 26px rgba(34, 229, 255, 0.5), 0 6px 26px rgba(255, 46, 166, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
            filter: brightness(0.96);
        }

        .modal-secondary-btn {
            width: 100% !important;
            height: auto !important;
            padding: 12px 20px !important;
            border-radius: 9999px !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            letter-spacing: 0.4px !important;
            background: rgba(34, 229, 255, 0.05) !important;
            border: 1px solid rgba(34, 229, 255, 0.18) !important;
            color: rgba(255, 255, 255, 0.85) !important;
        }

        .modal-secondary-btn:hover {
            background: rgba(34, 229, 255, 0.12) !important;
            border-color: rgba(34, 229, 255, 0.4) !important;
            color: #ffffff !important;
        }

        /* Stats Grid for Game Over */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-card-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-card-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        #final-score-val {
            color: var(--neon-cyan-soft);
            text-shadow: 0 0 12px rgba(34, 229, 255, 0.5);
        }

        #final-best-val {
            color: var(--neon-yellow);
            text-shadow: 0 0 12px rgba(255, 214, 10, 0.5);
        }

        #final-level-val {
            color: var(--neon-magenta);
            text-shadow: 0 0 12px rgba(255, 46, 166, 0.5);
        }

        .control-hint {
            position: absolute;
            bottom: max(18px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
            background: rgba(12, 14, 20, 0.5);
            backdrop-filter: blur(16px);
            padding: 5px 14px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Dynamic Notification Banner */
        .notification-banner {
            position: absolute;
            top: calc(max(16px, env(safe-area-inset-top)) + 52px);
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(160deg, rgba(20, 16, 40, 0.9), rgba(10, 12, 18, 0.9));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(34, 229, 255, 0.35);
            padding: 6px 16px;
            border-radius: 9999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 20px rgba(34, 229, 255, 0.2);
            z-index: 40;
            pointer-events: none;
            animation: dynamicIslandIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-content {
            color: rgba(255, 255, 255, 0.95);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .notification-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan), 0 0 16px var(--neon-cyan);
        }

        .hidden-banner {
            display: none;
        }

        /* Big Center-Screen Level Announcement (impossible to miss) */
        .level-announcement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 44;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .level-announcement.hidden-level-announcement {
            display: none;
        }

        .level-announce-sweep {
            position: absolute;
            top: 50%;
            left: -20%;
            width: 140%;
            height: 2px;
            transform: translateY(-50%) scaleX(0);
            transform-origin: center;
            background: linear-gradient(90deg, transparent 0%, rgba(34, 229, 255, 0) 8%, rgba(34, 229, 255, 0.95) 50%, rgba(255, 46, 166, 0) 92%, transparent 100%);
            box-shadow: 0 0 24px rgba(34, 229, 255, 0.85);
            animation: levelSweepAnim 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .level-announce-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 62vmax;
            height: 62vmax;
            transform: translate(-50%, -50%) scale(0.3);
            background: radial-gradient(circle, rgba(34, 229, 255, 0.24) 0%, rgba(255, 46, 166, 0.12) 38%, transparent 68%);
            opacity: 0;
            animation: levelGlowAnim 2.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .level-announce-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 24px;
            animation: levelCardAnim 2.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .level-announce-tag {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--neon-cyan-soft);
            text-shadow: 0 0 12px rgba(34, 229, 255, 0.7);
            margin-bottom: 2px;
            opacity: 0.9;
        }

        .level-announce-main {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: clamp(8px, 2.5vw, 16px);
            line-height: 1;
            white-space: nowrap;
        }

        .level-announce-word {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 700;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
        }

        .level-announce-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(56px, 18vw, 108px);
            font-weight: 900;
            line-height: 0.9;
            background: linear-gradient(115deg, var(--neon-cyan) 0%, var(--neon-magenta) 55%, var(--neon-orange) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 26px rgba(34, 229, 255, 0.55)) drop-shadow(0 0 50px rgba(255, 46, 166, 0.35));
        }

        .level-announce-rule {
            width: 120px;
            max-width: 40vw;
            height: 2px;
            margin: 10px 0 12px;
            background: rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .level-announce-rule span {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            transform: scaleX(0);
            transform-origin: center;
            animation: levelRuleAnim 0.7s 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .level-announce-name {

        <span id="lob-readout-label">Lob</span><span id="lob-readout-percent">0%</span>
        <div id="lob-readout-track"><div id="lob-readout-fill"></div></div>
    </div>
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.bgmBuffer = null;
                this.bgmSource = null;
                this.bgmGain = null;
                this.masterGain = null;
            }

            setMuted(value) {
                this.muted=Boolean(value);
                this.init();
                if(this.masterGain&&this.ctx) {
                    this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.masterGain.gain.setValueAtTime(this.muted?0:1,this.ctx.currentTime);
                }
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                        this.masterGain=this.ctx.createGain();
                        this.masterGain.gain.value=this.muted?0:1;
                        this.masterGain.connect(this.ctx.destination);
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPaddleHit(hitFactor = 0) {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const baseFreq = 220 + Math.abs(hitFactor) * 180;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.08);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start(now);
                osc.stop(now + 0.12);
            }

            playScoop() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.16);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start(now);
                osc.stop(now + 0.18);
            }

            playBallLand() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start(now);
                osc.stop(now + 0.12);
            }

            playTargetHit(hitStage) {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const stageFreqs = [440, 587.33, 880];
                const freq = stageFreqs[Math.min(hitStage - 1, 2)] || 440;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + 0.06);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start(now);
                osc.stop(now + 0.1);
            }

            playTargetDestroy() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;

                const bufferSize = this.ctx.sampleRate * 0.15;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, now);
                filter.frequency.exponentialRampToValueAtTime(150, now + 0.15);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain);
                noise.start(now);
            }

            playPowerUpSound() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.15);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.15);
                });
            }

            playLifeUp() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                // Bright ascending "1-up" arpeggio, capped with a sparkling high chime
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5 E5 G5 C6 E6
                notes.forEach((freq, idx) => {
                    const start = now + idx * 0.06;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.28, start);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(start);
                    osc.stop(start + 0.18);
                });

                const sparkleStart = now + notes.length * 0.06;
                const sparkle = this.ctx.createOscillator();
                const sparkleGain = this.ctx.createGain();
                sparkle.type = 'sine';
                sparkle.frequency.setValueAtTime(2093.00, sparkleStart); // C7
                sparkleGain.gain.setValueAtTime(0.15, sparkleStart);
                sparkleGain.gain.exponentialRampToValueAtTime(0.001, sparkleStart + 0.35);
                sparkle.connect(sparkleGain);
                sparkleGain.connect(this.masterGain);
                sparkle.start(sparkleStart);
                sparkle.stop(sparkleStart + 0.35);
            }

            playWallHit() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            playBallLost() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.4);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playLevelUp() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [220, 207.65, 196, 185];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.15);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + idx * 0.15);
                    osc.stop(now + idx * 0.15 + 0.25);
                });
            }

            playExplosion() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;

                // Sub-bass thump
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(28, now + 0.55);

                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.55);

                // Noise blast
                const bufferSize = Math.floor(this.ctx.sampleRate * 0.35);
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(900, now);
                filter.frequency.exponentialRampToValueAtTime(60, now + 0.35);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.35, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.masterGain);
                noise.start(now);
            }

            playLaserShot() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);

                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.12);
            }

            playShieldBounce() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(1040, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.22);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playSlowMo() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(180, now + 0.35);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            playComboSound(tier) {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                // Chords and triumphant arpeggios that scale up musically with each tier
                const tierFreqs = {
                    5: [440, 554.37, 659.25], // A major triad
                    10: [523.25, 659.25, 783.99, 1046.50], // C major arpeggio
                    15: [587.33, 739.99, 880.00, 1174.66], // D major high
                    20: [659.25, 830.61, 987.77, 1318.51], // E major triumphant
                    25: [783.99, 987.77, 1174.66, 1567.98, 2093.00] // G major mega fanfare
                };
                const freqs = tierFreqs[tier] || tierFreqs[25];
                freqs.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = tier >= 20 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    osc.frequency.exponentialRampToValueAtTime(freq * 1.06, now + idx * 0.05 + 0.14);
                    gain.gain.setValueAtTime(0.32, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.18);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.18);
                });
            }

            playComboScaleNote(streak) {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
                const noteIndex = Math.min((streak || 1) - 1, pentatonic.length - 1);
                const freq = pentatonic[noteIndex];

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.02, now + 0.12);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            playTitaniumHit() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1760, now);
                osc.frequency.exponentialRampToValueAtTime(620, now + 0.15);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            playMysteryReveal() {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.04);
                    gain.gain.setValueAtTime(0.24, now + idx * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.14);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now + idx * 0.04);
                    osc.stop(now + idx * 0.04 + 0.14);
                });
            }

            playPauseSound(isPaused) {
                if (this.muted || !this.ctx) return;
                this.init();
                const now = this.ctx.currentTime;
                const f1 = isPaused ? 520 : 340;
                const f2 = isPaused ? 340 : 520;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f1, now);
                osc.frequency.setValueAtTime(f2, now + 0.06);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.14);
            }

            buildBgmBuffer() {
                if (this.bgmBuffer || !this.ctx) return;
                const sampleRate = this.ctx.sampleRate;
                const bpm = 124;
                const stepSec = 60 / (bpm * 4); // 16th note (~0.121s)
                const totalSteps = 32;
                const duration = stepSec * totalSteps;
                const numSamples = Math.floor(sampleRate * duration);
                const buffer = this.ctx.createBuffer(2, numSamples, sampleRate);
                const left = buffer.getChannelData(0);
                const right = buffer.getChannelData(1);

                for (let step = 0; step < totalSteps; step++) {
                    const stepStart = Math.floor(step * stepSec * sampleRate);
                    const s16 = step % 16;

                    // 1. Kick (steps 0, 4, 8, 12)
                    if (s16 === 0 || s16 === 4 || s16 === 8 || s16 === 12) {
                        const kickLen = Math.floor(sampleRate * 0.08);
                        for (let n = 0; n < kickLen && stepStart + n < numSamples; n++) {
                            const t = n / sampleRate;
                            const freq = 120 * Math.exp(-t * 24) + 32;
                            const s = Math.sin(2 * Math.PI * freq * t) * (1 - t / 0.08) * 0.22;
                            left[stepStart + n] += s;
                            right[stepStart + n] += s;
                        }
                    }

                    // 2. Snare (steps 4, 12)
                    if (s16 === 4 || s16 === 12) {
                        const snareLen = Math.floor(sampleRate * 0.05);
                        for (let n = 0; n < snareLen && stepStart + n < numSamples; n++) {
                            const t = n / sampleRate;
                            const noise = (Math.random() * 2 - 1) * Math.exp(-t * 35) * 0.10;
                            left[stepStart + n] += noise;
                            right[stepStart + n] += noise;
                        }
                    }

                    // 3. Bass (even steps: D minor)
                    if (s16 % 2 === 0) {
                        const bassNotes = [73.42, 73.42, 87.31, 98.00, 73.42, 87.31, 110.00, 98.00];
                        const bFreq = bassNotes[(s16 / 2) % bassNotes.length];
                        const bassLen = Math.floor(sampleRate * 0.10);
                        for (let n = 0; n < bassLen && stepStart + n < numSamples; n++) {
                            const t = n / sampleRate;
                            const phase = (2 * Math.PI * bFreq * t) % (2 * Math.PI);
                            const saw = (phase / Math.PI - 1.0);
                            const env = Math.exp(-t * 18) * 0.12;
                            left[stepStart + n] += saw * env;
                            right[stepStart + n] += saw * env;
                        }
                    }

                    // 4. Arpeggio (odd steps)
                    if (s16 % 4 === 1 || s16 % 4 === 3) {
                        const arpNotes = [293.66, 349.23, 440.00, 523.25, 587.33, 440.00, 349.23, 329.63];
                        const aFreq = arpNotes[(step * 2) % arpNotes.length];
                        const arpLen = Math.floor(sampleRate * 0.08);
                        for (let n = 0; n < arpLen && stepStart + n < numSamples; n++) {
                            const t = n / sampleRate;
                            const tri = Math.asin(Math.sin(2 * Math.PI * aFreq * t)) * (2 / Math.PI);
                            const env = Math.exp(-t * 22) * 0.06;
                            left[stepStart + n] += tri * env * 0.8;
                            right[stepStart + n] += tri * env * 1.2;
                        }
                    }
                }

                this.bgmBuffer = buffer;
            }

            // Zero-overhead hardware looping synthwave BGM
            startBgm() {
                if (this.bgmSource || !this.ctx || this.muted) return;
                this.init();
                this.buildBgmBuffer();
                if (!this.bgmBuffer) return;

                const source = this.ctx.createBufferSource();
                source.buffer = this.bgmBuffer;
                source.loop = true;

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                source.connect(gain);
                gain.connect(this.masterGain);

                source.start(0);
                this.bgmSource = source;
                this.bgmGain = gain;
            }

            stopBgm() {
                if (this.bgmSource) {
                    try { this.bgmSource.stop(); } catch(e) {}
                    try { this.bgmSource.disconnect(); } catch(e) {}
                    this.bgmSource = null;
                }
                if(this.bgmGain) {
                    try { this.bgmGain.disconnect(); } catch(e) {}
                    this.bgmGain=null;
                }
            }

            pauseBgm() {
                if (this.bgmGain && this.ctx) {
                    this.bgmGain.gain.setValueAtTime(0, this.ctx.currentTime);
                }
            }

            resumeBgm() {
                if (this.muted) return;
                if (this.bgmGain && this.ctx && this.bgmSource) {
                    this.bgmGain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                } else {
                    this.startBgm();
                }
            }
        }

        function acquireFireballLight() {
            for (const light of fireballLightPool) {
                if (!light.userData.inUse) {

            }
            return null; // pool exhausted (rare: several simultaneous explosions) — fireball just renders without a flash light
        }

        function releaseFireballLight(light) {
            if (!light) return;
            light.userData.inUse = false;
            light.intensity = 0;
            scene.add(light); // reparent back to the scene root, detaching from the dead fireball's group
        }

        function spawnFireball(pos) {
            const group = new THREE.Group();
            group.position.set(pos.x, pos.y, pos.z);
            scene.add(group);

            // Layered expanding spheres: hot white core → orange mid → dark red outer
            const layers = [
                { color: 0xffffff, emissive: 0xffcc44, scale: 0.15, maxScale: 1.8, opacity: 1.0, speed: 1.0 },
                { color: 0xffaa00, emissive: 0xff6600, scale: 0.2, maxScale: 3.2, opacity: 0.85, speed: 0.85 },
                { color: 0xff4400, emissive: 0xff2200, scale: 0.25, maxScale: 4.5, opacity: 0.6, speed: 0.7 },
                { color: 0xcc0000, emissive: 0x880000, scale: 0.3, maxScale: 5.5, opacity: 0.35, speed: 0.55 },
            ];

            const sphereGeo = new THREE.IcosahedronGeometry(1, 2);
            const meshes = [];

            layers.forEach(layer => {
                const mat = new THREE.MeshBasicMaterial({
                    color: layer.color,
                    transparent: true,
                    opacity: layer.opacity,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                });
                const m = new THREE.Mesh(sphereGeo, mat);
                m.scale.setScalar(layer.scale);
                group.add(m);
                meshes.push({ mesh: m, layer });
            });

            // Bright flash point light — borrowed from the pool instead of allocated fresh
            const flashLight = acquireFireballLight();
            if (flashLight) {
                flashLight.position.set(0, 0, 0);
                flashLight.intensity = 12;
                group.add(flashLight);
            }

            fireballs.push({
                group,
                meshes,
                flashLight,
                sphereGeo,
                life: 0.65,
                maxLife: 0.65,
                elapsed: 0,
            });
        }

        function updateFireballs(dt) {
            for (let i = fireballs.length - 1; i >= 0; i--) {
                const fb = fireballs[i];
                fb.life -= dt;
                fb.elapsed += dt;
                const progress = fb.elapsed / fb.maxLife; // 0 → 1

                fb.meshes.forEach(({ mesh, layer }) => {
                    // Ease-out expansion
                    const t = 1 - Math.pow(1 - progress, 2.2);
                    const s = THREE.MathUtils.lerp(layer.scale, layer.maxScale, t);
                    // Slight random jitter for organic fire look
                    const jitter = 1.0 + (Math.random() - 0.5) * 0.12;
                    mesh.scale.setScalar(s * jitter);

                    // Fade out — fast at end
                    const fadeStart = 0.25;
                    const fade = progress < fadeStart ? 1.0 : Math.max(0, 1.0 - ((progress - fadeStart) / (1.0 - fadeStart)));
                    mesh.material.opacity = layer.opacity * fade * fade;

                    // Shift color toward dark red/black as it cools
                    if (progress > 0.4) {
                        const cool = (progress - 0.4) / 0.6;
                        mesh.material.color.lerp(new THREE.Color(0x220000), cool * 0.5);
                    }
                });

                // Flash light decays quickly
                if (fb.flashLight) {
                    fb.flashLight.intensity = Math.max(0, 12 * (1 - progress * 2.5));
                }

                if (fb.life <= 0) {
                    fb.meshes.forEach(({ mesh }) => {
                        mesh.material.dispose();
                    });
                    fb.sphereGeo.dispose();
                    releaseFireballLight(fb.flashLight);
                    scene.remove(fb.group);
                    fireballs.splice(i, 1);
                }
            }
        }

            const gradient = envCtx.createLinearGradient(0, 0, 0, 256);
            gradient.addColorStop(0, '#e2e8f0');
            gradient.addColorStop(0.5, '#64748b');
            gradient.addColorStop(1, '#0f172a');
            envCtx.fillStyle = gradient;
            envCtx.fillRect(0, 0, 256, 256);
            chromeEnvTexture = new THREE.CanvasTexture(envCanvas);
            chromeEnvTexture.mapping = THREE.EquirectangularReflectionMapping;

            // Procedural shimmering oceanic water caustics texture
            const waterCanvas = document.createElement('canvas');
            waterCanvas.width = 512;
            waterCanvas.height = 512;
            const waterCtx = waterCanvas.getContext('2d');
            const imgData = waterCtx.createImageData(512, 512);
            for (let y = 0; y < 512; y++) {
                for (let x = 0; x < 512; x++) {
                    const u = (x / 512) * Math.PI * 2;
                    const v = (y / 512) * Math.PI * 2;
                    const c1 = Math.abs(Math.sin(u * 6 + v * 4) * Math.cos(u * 4 - v * 6));
                    const c2 = Math.abs(Math.sin(u * 14 - v * 11) * Math.cos(u * 11 + v * 14));
                    const caustic = Math.pow(c1 * 0.65 + c2 * 0.35, 2.0);

                    const i = (y * 512 + x) * 4;
                    imgData.data[i] = Math.floor(4 + caustic * 50);       // Deep ocean Red
                    imgData.data[i + 1] = Math.floor(55 + caustic * 145); // Turquoise Green
                    imgData.data[i + 2] = Math.floor(120 + caustic * 135);// Cyan/Blue
                    imgData.data[i + 3] = 255;
                }
            }
            waterCtx.putImageData(imgData, 0, 0);
            waterTexture = new THREE.CanvasTexture(waterCanvas);
            waterTexture.wrapS = THREE.RepeatWrapping;
            waterTexture.wrapT = THREE.RepeatWrapping;
            waterTexture.repeat.set(16, 16);

            // True High-Resolution Tangent-Space Ocean Normal Map
            const normSize = 512;
            const normCanvas = document.createElement('canvas');
            normCanvas.width = normSize;
            normCanvas.height = normSize;
            const normCtx = normCanvas.getContext('2d');
            const normImgData = normCtx.createImageData(normSize, normSize);

            // Generate layered continuous height field
            const heights = new Float32Array(normSize * normSize);
            for (let y = 0; y < normSize; y++) {
                for (let x = 0; x < normSize; x++) {
                    const u = (x / normSize) * Math.PI * 2;
                    const v = (y / normSize) * Math.PI * 2;

                    const h1 = Math.sin(u * 4 + v * 3) * 0.45;
                    const h2 = Math.cos(u * 7 - v * 5) * 0.28;
                    const h3 = Math.sin(u * 13 + v * 15) * 0.16;
                    const h4 = Math.cos(u * 24 - v * 20) * 0.08;
                    const h5 = Math.sin(u * 42 + v * 36) * 0.04;

                    heights[y * normSize + x] = h1 + h2 + h3 + h4 + h5;
                }
            }

            // Compute Sobel normal gradients for tangent space normals
            const strength = 3.5;
            for (let y = 0; y < normSize; y++) {
                for (let x = 0; x < normSize; x++) {
                    const xL = (x - 1 + normSize) % normSize;
                    const xR = (x + 1) % normSize;
                    const yU = (y - 1 + normSize) % normSize;
                    const yD = (y + 1) % normSize;

                    const dX = (
                        -heights[yU * normSize + xL] + heights[yU * normSize + xR]
                        -2 * heights[y * normSize + xL] + 2 * heights[y * normSize + xR]
                        -heights[yD * normSize + xL] + heights[yD * normSize + xR]
                    ) * 0.25;

                    const dY = (
                        -heights[yU * normSize + xL] - 2 * heights[yU * normSize + x] - heights[yU * normSize + xR]
                        +heights[yD * normSize + xL] + 2 * heights[yD * normSize + x] + heights[yD * normSize + xR]
                    ) * 0.25;

                    let nx = -dX * strength;
                    let ny = -dY * strength;
                    let nz = 1.0;
                    const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                    nx /= len;
                    ny /= len;
                    nz /= len;

                    const idx = (y * normSize + x) * 4;
                    normImgData.data[idx] = Math.floor((nx * 0.5 + 0.5) * 255);
                    normImgData.data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
                    normImgData.data[idx + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
                    normImgData.data[idx + 3] = 255;
                }
            }

            normCtx.putImageData(normImgData, 0, 0);
            waterNormalMap = new THREE.CanvasTexture(normCanvas);
            waterNormalMap.wrapS = THREE.RepeatWrapping;
            waterNormalMap.wrapT = THREE.RepeatWrapping;
            waterNormalMap.repeat.set(22, 22);
        }

        // Automatic VISUAL quality only. Collision timing and input never change.
        const AUTO_QUALITY_LEVELS = [
            { name:'full', pixelRatio:2, shadowSize:1024, particles:400, burstScale:1 },
            { name:'balanced', pixelRatio:1.5, shadowSize:1024, particles:240, burstScale:.75 },
            { name:'performance', pixelRatio:1, shadowSize:512, particles:140, burstScale:.5 }
        ];
        const autoQuality = {
            enabled: (navigator.maxTouchPoints || 0) > 0 ||
                (typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches),
            tier:0, elapsed:0, frames:0, slowWindows:0, fastWindows:0, cooldown:4, measuredFPS:null
        };

        function applyVisualQuality(tier) {
            const next=Math.max(0,Math.min(AUTO_QUALITY_LEVELS.length-1,tier));
            if(next===autoQuality.tier) return;
            autoQuality.tier=next;
            const quality=AUTO_QUALITY_LEVELS[next];
            if(renderer) renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,quality.pixelRatio));
            if(sunLight && sunLight.shadow.mapSize.width!==quality.shadowSize) {
                sunLight.shadow.mapSize.set(quality.shadowSize,quality.shadowSize);
                if(sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map=null; }
                sunLight.shadow.needsUpdate=true;
            }
            autoQuality.slowWindows=autoQuality.fastWindows=0;
        }

        function updateAutomaticQuality(frameDt) {
            if(!autoQuality.enabled) return;
            if(document.hidden || gameState!=='PLAYING' || isBallDocked || isLevelCompleting || frameDt<=0 || !Number.isFinite(frameDt)) {
                autoQuality.elapsed=autoQuality.frames=autoQuality.slowWindows=autoQuality.fastWindows=0;
                return;
            }
            autoQuality.cooldown=Math.max(0,autoQuality.cooldown-frameDt);
            autoQuality.elapsed+=frameDt;
            autoQuality.frames++;
            if(autoQuality.elapsed<3) return;
            const fps=autoQuality.frames/autoQuality.elapsed;
            autoQuality.measuredFPS=fps;
            autoQuality.elapsed=autoQuality.frames=0;
            if(autoQuality.cooldown>0) { autoQuality.slowWindows=autoQuality.fastWindows=0; return; }
            autoQuality.slowWindows=fps<48?autoQuality.slowWindows+1:0;
            autoQuality.fastWindows=fps>57?autoQuality.fastWindows+1:0;
            if(autoQuality.slowWindows>=2 && autoQuality.tier<AUTO_QUALITY_LEVELS.length-1) {
                applyVisualQuality(autoQuality.tier+1);
                autoQuality.cooldown=6;
            } else if(autoQuality.fastWindows>=8 && autoQuality.tier>0) {
                applyVisualQuality(autoQuality.tier-1);
                autoQuality.cooldown=12;
            }
        }

        function targetBounds(target) {
            // Cannon marks its cached bounds dirty after a transform is integrated.
            // Sleeping/static bodies keep the same cached AABB indefinitely.
            if(target.body.aabbNeedsUpdate) target.body.computeAABB();
            return target.body.aabb;
        }

        function wakeConnectedSupports(source) {
            if(!source) return;
            const pending=[source],seen=new Set([source]);
            for(let i=0;i<pending.length;i++) {
                const base=targetBounds(pending[i]);
                for(const candidate of targets) {
                    if(candidate.isIndestructible || candidate.isDestroying || seen.has(candidate)) continue;
                    const box=targetBounds(candidate);
                    // Follow physical support upwards, including broad beams, overhangs,
                    // and their next floor. Never wake unrelated ground-level blocks.
                    if(box.lowerBound.y<base.lowerBound.y+.04 ||
                       box.lowerBound.y>base.upperBound.y+.24 ||
                       box.upperBound.y<base.upperBound.y-.12 ||
                       box.upperBound.x<base.lowerBound.x-.08 ||
                       box.lowerBound.x>base.upperBound.x+.08 ||
                       box.upperBound.z<base.lowerBound.z-.08 ||
                       box.lowerBound.z>base.upperBound.z+.08) continue;
                    seen.add(candidate);
                    candidate.body.wakeUp();
                    pending.push(candidate);
                }
            }
        }

        const oceanTimeUniform={value:0};
        function configureOceanShader(material) {
            const gl=value=>Number(value).toFixed(8);
            const waveCode=GERSTNER_WAVES.map((wave,i)=>`
                float wavePhase${i}=(position.x*${gl(wave.dirX)}+position.y*${gl(wave.dirY)})*${gl(wave.freq)}+uOceanTime*${gl(wave.speed)};
                float waveCos${i}=cos(wavePhase${i});
                transformed.x+=${gl(wave.steepness*wave.amp*wave.dirX)}*waveCos${i};
                transformed.y+=${gl(wave.steepness*wave.amp*wave.dirY)}*waveCos${i};
                transformed.z+=${gl(wave.amp)}*sin(wavePhase${i});
            `).join('\n');
            material.onBeforeCompile=shader=> {
                shader.uniforms.uOceanTime=oceanTimeUniform;
                shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nuniform float uOceanTime;')
                    .replace('#include <begin_vertex>','vec3 transformed=vec3(position);\n'+waveCode);
            };
            material.customProgramCacheKey=()=> 'pongster-gerstner-ocean-v1';
        }

        // Gameplay lifecycle and fixed-step simulation. Visual quality never changes these constants.
        const SIMULATION_STEP=1/120;
        const MAX_CATCHUP_STEPS=32;
        let simulationAccumulator=0,simulationTime=0,gameFrameEpoch=0;
        let levelTransitionRemaining=0,levelTransitionRevision=0;
        let settingsReturnState='PAUSED';
        let hudDirty=true,hudForceReset=true,lastHeartState='';
        let viewportResizePending=true,lastViewportWidth=0,lastViewportHeight=0;

        function resetSimulationTiming(resetClock=false,resetFrameEpoch=false) {
            simulationAccumulator=0;
            if(resetClock) simulationTime=0;
            if(resetClock||resetFrameEpoch) gameFrameEpoch=performance.now();
        }
        function beginLevelTransition() {
            if(isLevelCompleting || gameState!=='PLAYING') return;
            isLevelCompleting=true;
            levelTransitionRevision=levelRevision;
            levelTransitionRemaining=1.5;
            timeScale=.2;
            resetCombo();
            soundFX.playLevelUp();
            // The clear is committed: the outgoing balls can no longer cost lives.
            for(const ball of balls) ball.body.velocity.set(0,0,0);
        }
        function finishLevelTransition() {
            levelTransitionRemaining=0;
            timeScale=1;
            isLevelCompleting=false;
            resetSimulationTiming();
            if(currentLevel>=CAMPAIGN_LEVELS.length) { gameOver(true); return; }
            currentLevel++;
            updateHUD();
            powerUps.forEach(p=>disposeMesh(p.mesh));powerUps=[];
            powerUpLightPool.forEach(light=>light.intensity=0);
            laserBolts.forEach(b=>disposeMesh(b.mesh));laserBolts=[];
            flameEmbers.forEach(e=>disposeMesh(e.mesh));flameEmbers=[];
            if(predictiveAimPointer) { predictiveAimPointer.visible=false;predictiveAimFlash=0; }
            spawnTargets();
            dockNewBall();
        }
        function advanceLevelTransition(elapsed) {
            if(!isLevelCompleting || gameState!=='PLAYING') return;
            if(levelTransitionRevision!==levelRevision) {
                // A deliberate restart or level replacement cancels cleanly, never leaving slow motion stuck.
                levelTransitionRemaining=0;isLevelCompleting=false;timeScale=1;resetSimulationTiming();return;
            }
            levelTransitionRemaining-=elapsed;
            if(levelTransitionRemaining<=1e-9) finishLevelTransition();
        }
        function advanceGameFrame(elapsed) {
            if(document.hidden || gameState!=='PLAYING' || !Number.isFinite(elapsed) || elapsed<=0) {
                resetSimulationTiming();return;
            }
            if(isLevelCompleting) { resetSimulationTiming();advanceLevelTransition(elapsed);return; }
            if(isBallDocked) {
                // Aiming and existing pickups/projectiles still update while waiting to serve.
                handleKeyboardInput(elapsed);
                updateTiltControl(elapsed);
                updateGameLogic(elapsed);
                if(gameState==='PLAYING'&&!isLevelCompleting) {
                    updateLasers(elapsed);
                    updatePowerUpTimers(elapsed);
                }
                resetSimulationTiming();return;
            }
            simulationAccumulator+=Math.min(elapsed,SIMULATION_STEP*MAX_CATCHUP_STEPS);
            let steps=0;
            while(simulationAccumulator+1e-9>=SIMULATION_STEP && steps<MAX_CATCHUP_STEPS) {
                simulationAccumulator=Math.max(0,simulationAccumulator-SIMULATION_STEP);
                simulationTime+=SIMULATION_STEP;
                steps++;
                handleKeyboardInput(SIMULATION_STEP);
                updateTiltControl(SIMULATION_STEP);
                updatePaddlePosition(SIMULATION_STEP);
                for(const ball of balls) {
                    if(!ball.body.preStepVelocity) ball.body.preStepVelocity=new CANNON.Vec3();
                    ball.body.preStepVelocity.copy(ball.body.velocity);
                    ball.body.pendingBlockBounce=null;
                }
                steerPongCube(SIMULATION_STEP);
                world.step(SIMULATION_STEP);
                if(!isLevelCompleting) {
                    updateCampaignPhysics(SIMULATION_STEP);
                    updateGameLogic(SIMULATION_STEP);
                    if(gameState==='PLAYING' && !isLevelCompleting && !isBallDocked) {
                        updateLasers(SIMULATION_STEP);
                        updateShield(SIMULATION_STEP);
                        updatePowerUpTimers(SIMULATION_STEP);
                    }
                }
                if(gameState!=='PLAYING' || isBallDocked || isLevelCompleting) {
                    if(isLevelCompleting) advanceLevelTransition(simulationAccumulator);
                    resetSimulationTiming();break;
                }
            }
            // Bound exceptional stalls rather than carrying an ever-growing backlog.
            if(steps===MAX_CATCHUP_STEPS) simulationAccumulator=Math.min(simulationAccumulator,SIMULATION_STEP);
        }

        function makeBallAppearanceMaterial() {

        // Additive trails/sparks are batched; per-instance alpha keeps their existing fade.
        const TRAIL_CAPACITY=72,HISTORY_CAPACITY=120;
        const TRAIL_DETAIL=[72,48,32],SPARK_BUDGET=[256,160,96];
        const fxMatrix=new THREE.Matrix4(),fxQuaternion=new THREE.Quaternion();
        const fxPosition=new THREE.Vector3(),fxScale=new THREE.Vector3(),fxColor=new THREE.Color();
        let sparkPool=null;

        function configureInstanceAlpha(material) {
            material.onBeforeCompile=shader=> {
                shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nattribute float instanceAlpha;\nvarying float vInstanceAlpha;')
                    .replace('#include <begin_vertex>','#include <begin_vertex>\nvInstanceAlpha=instanceAlpha;');
                shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nvarying float vInstanceAlpha;')
                    .replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.a*=vInstanceAlpha;');
            };
            material.customProgramCacheKey=()=> 'pongster-instance-alpha-v1';
        }
        function createBallTrail(position) {
            const geometry=new THREE.SphereGeometry(.34,12,12);
            geometry.setAttribute('instanceAlpha',new THREE.InstancedBufferAttribute(new Float32Array(TRAIL_CAPACITY),1).setUsage(THREE.DynamicDrawUsage));
            const material=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});
            configureInstanceAlpha(material);
            const mesh=new THREE.InstancedMesh(geometry,material,TRAIL_CAPACITY);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            for(let i=0;i<TRAIL_CAPACITY;i++) mesh.setColorAt(i,fxColor.setHex(0xffffff));
            mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
            mesh.count=0;mesh.visible=false;mesh.frustumCulled=false;
            scene.add(mesh);
            return mesh;
        }
        function createTrailHistory(position) {
            const data={points:new Float32Array(HISTORY_CAPACITY*3),distances:new Float32Array(HISTORY_CAPACITY),head:0,count:1};
            data.points[0]=position.x;data.points[1]=position.y;data.points[2]=position.z;
            return data;
        }
        function correctTrailHead(ball,position) {
            if(!ball.trailData) return;
            const index=ball.trailData.head*3;
            ball.trailData.points[index]=position.x;ball.trailData.points[index+1]=position.y;ball.trailData.points[index+2]=position.z;
        }
        function updateBatchedBallTrails(dt) {
            for(const ball of balls) {
                if(!ball.mesh || !ball.trailGroup || !ball.trailData) continue;
                const mesh=ball.trailGroup,data=ball.trailData,p=ball.mesh.position;
                const points=data.points,distances=data.distances;
                if(isBallDocked) {
                    data.count=1;correctTrailHead(ball,p);mesh.count=0;mesh.visible=false;continue;
                }
                let index=data.head*3;
                const dx=p.x-points[index],dy=p.y-points[index+1],dz=p.z-points[index+2];
                if(dx*dx+dy*dy+dz*dz>.0016) {
                    data.head=(data.head+HISTORY_CAPACITY-1)%HISTORY_CAPACITY;
                    index=data.head*3;
                    points[index]=p.x;points[index+1]=p.y;points[index+2]=p.z;
                    data.count=Math.min(data.count+1,ball.isAirborne?HISTORY_CAPACITY:65);
                }
                if(data.count<2) {mesh.count=0;mesh.visible=false;continue;}

                    totalLength+=Math.hypot(points[a]-points[b],points[a+1]-points[b+1],points[a+2]-points[b+2]);
                    distances[j]=totalLength;
                }
                const levelProg=Math.min((currentLevel-1)*1.75,7),scoreProg=Math.min(score/350,2),comboProg=Math.min(currentCombo*.12,1.2);
                const baseLength=Math.min(3.2+levelProg+scoreProg+comboProg+(isFireballActive?2:0),13.5);
                const desiredLength=baseLength*(ball.isAirborne?2:1);
                if(ball.smoothTrailLength===undefined)ball.smoothTrailLength=3.2;
                ball.smoothTrailLength=THREE.MathUtils.lerp(ball.smoothTrailLength,desiredLength,Math.min((ball.isAirborne?5.5:3.2)*dt,1));
                const activeLength=Math.min(totalLength,ball.smoothTrailLength);
                const progress=THREE.MathUtils.clamp((ball.smoothTrailLength-3.2)/8,0,1);
                const baseScale=(.65+progress*.35)*(isFireballActive?1.2:.85);
                const count=TRAIL_DETAIL[autoQuality.tier];
                const c0=isFireballActive?fbColorWhite:trailColorWhite,c1=isFireballActive?fbColorYellow:trailColorTeal;
                const c2=isFireballActive?fbColorRed:trailColorBlue,c3=isFireballActive?fbColorBlack:trailColorBlack;
                const alpha=mesh.geometry.attributes.instanceAlpha;
                let segment=0;
                for(let j=0;j<count;j++) {
                    const t=j/(count-1),distance=t*activeLength;
                    // A forward-only cursor replaces a full history scan for every node.
                    while(segment<data.count-2 && distances[segment+1]<distance)segment++;
                    const a=((data.head+segment)%HISTORY_CAPACITY)*3,b=((data.head+segment+1)%HISTORY_CAPACITY)*3;
                    const mix=THREE.MathUtils.clamp((distance-distances[segment])/Math.max(.0001,distances[segment+1]-distances[segment]),0,1);
                    fxPosition.set(points[a]+(points[b]-points[a])*mix,points[a+1]+(points[b+1]-points[a+1])*mix,points[a+2]+(points[b+2]-points[a+2])*mix);
                    const taper=Math.pow(1-t,.6);

        }

        function ensureSparkPool() {

            const material=new THREE.MeshStandardMaterial({color:0xffff00,emissive:0xffea00,emissiveIntensity:2,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});
            configureInstanceAlpha(material);

            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);mesh.count=0;mesh.visible=false;mesh.frustumCulled=false;
            scene.add(mesh);

        function emitPooledSparks(position) {
            const pool=ensureSparkPool();

            const count=Math.min(Math.max(1,Math.round(8*AUTO_QUALITY_LEVELS[autoQuality.tier].burstScale)),limit-sparks.length,pool.free.length);
            for(let i=0;i<count;i++) {
                const spark=pool.free.pop();

                spark.velocity.set((Math.random()-.5)*5,Math.random()*2.2+.5,(Math.random()-.5)*5-1.2);

        }
        function clearPooledSparks() {

            }
            sparks.length=0;
        }
        function updatePooledSparks(dt) {
            if(!sparkPool)return;
            if(!sparks.length) {sparkPool.mesh.count=0;sparkPool.mesh.visible=false;return;}
            for(let i=sparks.length-1;i>=0;i--) {
                const spark=sparks[i];
                spark.life-=dt;
                if(spark.life<=0) {
                    const last=sparks.pop();if(i<sparks.length)sparks[i]=last;

            for(let i=0;i<sparks.length;i++) {
                const spark=sparks[i],fade=Math.max(0,spark.life/1.4);
                fxScale.setScalar(fade);fxMatrix.compose(spark.position,fxQuaternion,fxScale);mesh.setMatrixAt(i,fxMatrix);alpha.array[i]=fade;
            }
