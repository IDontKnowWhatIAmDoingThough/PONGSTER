        }

        const BREAKABLE_SIZE_SCALE=1.25;
        function blueprintBounds(block) {
            const angle=block.ry||0,c=Math.abs(Math.cos(angle)),s=Math.abs(Math.sin(angle));
            const hx=(c*block.w+s*block.d)/2,hz=(s*block.w+c*block.d)/2;
            return {minX:block.x-hx,maxX:block.x+hx,minY:block.y-block.h/2,maxY:block.y+block.h/2,minZ:block.z-hz,maxZ:block.z+hz,hx,hz};
        }
        function blueprintOverlaps(a,b,padding=.025) {
            const x=blueprintBounds(a),y=blueprintBounds(b);
            return x.minX<y.maxX+padding&&x.maxX>y.minX-padding&&x.minY<y.maxY-.001&&x.maxY>y.minY+.001&&x.minZ<y.maxZ+padding&&x.maxZ>y.minZ-padding;
        }
        function enlargeLevelPieces(blocks,level,trap) {
            const scale=BREAKABLE_SIZE_SCALE;
            const anchors={1:-12.94,2:-13.5,3:-10.25,4:-13.6,6:-13.5};
            const anchor=anchors[level]??-14.5;
            for(const block of blocks) {
                if(block.type==='black')continue;
                // Keep the original mass and damage tier: this changes target size, not hit points or knockback mass.
                block.originalMass=Math.max(.6,block.w*block.h*block.d*2.2);
                block.w*=scale;block.h*=scale;block.d*=scale;
                block.x*=scale;block.y*=scale;block.z=anchor+(block.z-anchor)*scale;
                const box=blueprintBounds(block);
                block.x=Math.max(-ARENA.width+box.hx+.08,Math.min(ARENA.width-box.hx-.08,block.x));
                block.z=Math.max(ARENA.backZ+box.hz+.08,block.z);
                if(trap)block.z=Math.min(trap.rear-box.hz-.12,block.z);
            }
            if(level===6) {
                // Pointed end caps sit on top of the larger bridge spans, not inside them.
                for(const block of blocks) {
                    if(block.shape==='prism')block.y+=.21;
                    if(block.shape==='box'&&Math.abs(block.h-.2)<1e-9&&block.w>5)block.x+=Math.sign(block.x)*.04125;
                }
            }
            if(level===8) {
                // Equal-clearance samples keep the inner spiral from overlapping itself.
                const spiral=blocks.slice(0,53),obstacles=blocks.slice(53),placed=[];
                let angle=0;
                for(const block of spiral) {
                    let found=false;
                    for(let attempt=0;attempt<10000;attempt++,angle+=.015) {
                        const radius=1.7+angle*.25;
                        block.x=Math.cos(angle)*radius;
                        block.z=-14.5+Math.sin(angle)*radius;
                        const b=blueprintBounds(block);
                        if(b.minX< -ARENA.width+.08||b.maxX>ARENA.width-.08||b.minZ<ARENA.backZ+.08||b.maxZ> -6.2)continue;
                        if(placed.some(other=>blueprintOverlaps(block,other,.04))||obstacles.some(other=>blueprintOverlaps(block,other,.06)))continue;
                        found=true;placed.push(block);angle+=.015;break;
                    }
                    if(!found)throw new Error('Unable to fit the enlarged spiral safely.');
                }
            }
            if(level===10) {
                // Widen/deepen the original thirteen-piece front arc while keeping it behind the unchanged wall.
                const arc=blocks.filter(b=>b.shape==='box'&&b.w===1&&(b.type==='green'||b.type==='explosive'));
                for(let i=0;i<arc.length;i++) {
                    const angle=Math.PI*i/(arc.length-1);
                    arc[i].x=Math.cos(angle)*6.1;
                    arc[i].z=-13+Math.sin(angle)*5.2;
                }
                for(const block of blocks)if(block.type==='explosive'&&Math.abs(block.x)<.01&&block.z< -15)block.z=-16.4;
            }
            // Static black bumpers retain their exact coordinates. Nudge only a ground target
            // if its enlarged footprint intersects one; stacked structures are left connected.
            const fixed=blocks.filter(b=>b.type==='black');
            for(const block of blocks) {
                if(block.type==='black')continue;
                for(let pass=0;pass<4;pass++) {
                    const obstacle=fixed.find(other=>blueprintOverlaps(block,other,.035));
                    if(!obstacle)break;
                    const a=blueprintBounds(block),b=blueprintBounds(obstacle),oldX=block.x,oldZ=block.z;
                    const moves=[{x:b.minX-a.hx-.045,z:oldZ},{x:b.maxX+a.hx+.045,z:oldZ},{x:oldX,z:b.minZ-a.hz-.045},{x:oldX,z:b.maxZ+a.hz+.045}];
                    moves.sort((p,q)=>Math.hypot(p.x-oldX,p.z-oldZ)-Math.hypot(q.x-oldX,q.z-oldZ));
                    let moved=false;
                    for(const move of moves) {
                        block.x=move.x;block.z=move.z;
                        const box=blueprintBounds(block);
                        if(box.minX< -ARENA.width+.06||box.maxX>ARENA.width-.06||box.minZ<ARENA.backZ+.06||(trap&&box.maxZ>trap.rear-.06))continue;
                        if(blocks.some(other=>other!==block&&blueprintOverlaps(block,other,.01)))continue;
                        moved=true;break;
                    }
                    if(!moved) {block.x=oldX;block.z=oldZ;throw new Error('An enlarged target overlaps a fixed obstacle.');}
                }
            }
        }

        const LASER_SPEED=56,LASER_RADIUS=.065,LASER_LENGTH=.95;
        const laserLocalStart=new THREE.Vector3(),laserLocalEnd=new THREE.Vector3(),laserLocalDelta=new THREE.Vector3();
        const laserBodyInverse=new THREE.Quaternion(),laserShapeInverse=new THREE.Quaternion();
        const laserSweepStart=new THREE.Vector3(),laserSweepEnd=new THREE.Vector3(),laserSweepDelta=new THREE.Vector3();
        const laserVelocityScratch=new THREE.Vector3(),laserDirectionScratch=new THREE.Vector3(),laserContactPoint=new THREE.Vector3();
        const laserAimTop=new THREE.Vector3(),laserAimBottom=new THREE.Vector3(),laserAimPoint=new THREE.Vector3();
        const laserEmitter=new THREE.Vector3(),laserMuzzle=new THREE.Vector3();
        const laserWorldRotation=new THREE.Quaternion(),laserParentInverse=new THREE.Quaternion();
        const laserForwardAxis=new THREE.Vector3(0,0,-1);
        const laserInterval={enter:0,exit:1};

        function sweepLaserAgainstTarget(target,start,end,radius,out=laserInterval) {
            if(!target||target.isDestroying||!target.body||!target.body.shapes.length)return false;
            const body=target.body,bounds=targetBounds(target);
            if(Math.max(start.x,end.x)+radius<bounds.lowerBound.x||Math.min(start.x,end.x)-radius>bounds.upperBound.x||
               Math.max(start.y,end.y)+radius<bounds.lowerBound.y||Math.min(start.y,end.y)-radius>bounds.upperBound.y||
               Math.max(start.z,end.z)+radius<bounds.lowerBound.z||Math.min(start.z,end.z)-radius>bounds.upperBound.z)return false;
            const shape=body.shapes[0],hull=shape.convexPolyhedronRepresentation||shape;
            if(!hull.faceNormals||!hull.faces||!hull.vertices)return false;
            laserBodyInverse.copy(body.quaternion).invert();
            laserLocalStart.copy(start).sub(body.position).applyQuaternion(laserBodyInverse);
            laserLocalEnd.copy(end).sub(body.position).applyQuaternion(laserBodyInverse);
            const offset=body.shapeOffsets[0];
            if(offset) {laserLocalStart.sub(offset);laserLocalEnd.sub(offset);}
            const orientation=body.shapeOrientations[0];
            if(orientation) {
                laserShapeInverse.copy(orientation).invert();
                laserLocalStart.applyQuaternion(laserShapeInverse);laserLocalEnd.applyQuaternion(laserShapeInverse);
            }
            laserLocalDelta.subVectors(laserLocalEnd,laserLocalStart);
            let enter=0,exit=1;
            // Clip a swept beam against the real convex collision shape. Expanding
            // each face by its visible radius is conservative at corners, avoiding
            // point-ray misses without replacing cylinders/prisms with big boxes.
            for(let i=0;i<hull.faceNormals.length;i++) {
                const normal=hull.faceNormals[i],vertex=hull.vertices[hull.faces[i][0]];
                const outside=normal.x*(laserLocalStart.x-vertex.x)+normal.y*(laserLocalStart.y-vertex.y)+normal.z*(laserLocalStart.z-vertex.z)-radius;
                const rate=normal.x*laserLocalDelta.x+normal.y*laserLocalDelta.y+normal.z*laserLocalDelta.z;
                if(Math.abs(rate)<1e-10) {if(outside>1e-8)return false;continue;}
                const time=-outside/rate;
                if(rate<0)enter=Math.max(enter,time);else exit=Math.min(exit,time);
                if(enter>exit+1e-8)return false;
            }
            if(exit<0||enter>1)return false;
            out.enter=Math.max(0,enter);out.exit=Math.min(1,exit);return true;
        }

        function chooseLaserDirection(origin,out) {
            let nearest=Infinity,lowest=Infinity,found=false;
            const depths=[.5,.25,.75,.1,.9];
            for(const target of targets) {
                if(target.isDestroying)continue;
                const b=targetBounds(target),distance=origin.z-b.upperBound.z;
                if(distance<.15||distance>nearest+1e-6||origin.x<b.lowerBound.x-LASER_RADIUS||origin.x>b.upperBound.x+LASER_RADIUS)continue;
                if(Math.abs(distance-nearest)<1e-6&&b.lowerBound.y>=lowest)continue;
                for(const fraction of depths) {
                    const z=b.lowerBound.z+(b.upperBound.z-b.lowerBound.z)*fraction;
                    laserAimTop.set(origin.x,b.upperBound.y+1,z);
                    laserAimBottom.set(origin.x,b.lowerBound.y-1,z);
                    if(!sweepLaserAgainstTarget(target,laserAimTop,laserAimBottom,LASER_RADIUS))continue;
                    const middle=(laserInterval.enter+laserInterval.exit)*.5;
                    laserAimPoint.copy(laserAimTop).lerp(laserAimBottom,middle);
                    nearest=distance;lowest=b.lowerBound.y;found=true;break;
                }

            if(!found)laserAimPoint.set(origin.x,.16,ARENA.backZ);
            // Keep the player's left/right lane. Only the elevation is adjusted,
            // allowing lasers to hit short bricks and fallen thin beams reliably.
            out.subVectors(laserAimPoint,origin);out.x=0;
            if(out.z>=-.05)out.set(0,0,-1);
            return out.normalize();
        }

        function fireAlignedLasers() {
            if(!paddle||!isLaserPaddleActive||isBallDocked||gameState!=='PLAYING'||isLevelCompleting)return;
            soundFX.playLaserShot();
            const width=paddle.userData.width||3.8,depth=paddle.userData.depth||.86;
            const cannons=paddle.userData.laserCannons||[];
            paddle.updateMatrixWorld(true);
            for(let side=0;side<2;side++) {
                const cannon=cannons[side];
                if(cannon) {
                    cannon.getWorldPosition(laserEmitter);
                    chooseLaserDirection(laserEmitter,laserDirectionScratch);
                    laserWorldRotation.setFromUnitVectors(laserForwardAxis,laserDirectionScratch);
                    paddle.getWorldQuaternion(laserParentInverse).invert();
                    cannon.quaternion.copy(laserParentInverse).multiply(laserWorldRotation);
                    cannon.updateMatrixWorld(true);
                    laserMuzzle.set(0,0,-.375);cannon.localToWorld(laserMuzzle);
                } else {
                    laserMuzzle.set(paddle.position.x+(side===0?-1:1)*width*.44,paddle.position.y+.15,paddle.position.z-depth*.55);
                    chooseLaserDirection(laserMuzzle,laserDirectionScratch);
                    laserWorldRotation.setFromUnitVectors(laserForwardAxis,laserDirectionScratch);
                }
                const geometry=new THREE.CylinderGeometry(LASER_RADIUS,LASER_RADIUS,LASER_LENGTH,8);
                geometry.rotateX(Math.PI/2);
                const material=new THREE.MeshBasicMaterial({color:0xff0055,transparent:true,opacity:.95,blending:THREE.AdditiveBlending});
                const mesh=new THREE.Mesh(geometry,material);
                mesh.quaternion.copy(laserWorldRotation);
                mesh.position.copy(laserMuzzle).addScaledVector(laserDirectionScratch,LASER_LENGTH/2);
                scene.add(mesh);
                laserBolts.push({mesh,velocity:laserDirectionScratch.clone().multiplyScalar(LASER_SPEED),velocityZ:laserDirectionScratch.z*LASER_SPEED,radius:LASER_RADIUS,halfLength:LASER_LENGTH/2});
                createPaddleSparks(laserMuzzle);
            }
        }

        function updateSweptLasers(dt) {
            if(gameState!=='PLAYING'||isLevelCompleting)return;
            if(isLaserPaddleActive&&!isBallDocked) {
                laserShootCooldown-=dt;
                if(laserShootCooldown<=0){laserShootCooldown=.28;shootLaser();}
            }
            if(!laserBolts.length)return;
            for(let i=laserBolts.length-1;i>=0;i--) {
                const bolt=laserBolts[i],velocity=bolt.velocity||laserVelocityScratch.set(0,0,bolt.velocityZ);
                laserDirectionScratch.copy(velocity).normalize();
                const half=bolt.halfLength??LASER_LENGTH/2,radius=bolt.radius??LASER_RADIUS;
                laserSweepStart.copy(bolt.mesh.position).addScaledVector(laserDirectionScratch,-half);
                laserSweepEnd.copy(bolt.mesh.position).addScaledVector(velocity,dt).addScaledVector(laserDirectionScratch,half);

                        hit=target;earliest=laserInterval.enter;
                    }

                if(hit) {
                    laserContactPoint.copy(laserSweepStart).lerp(laserSweepEnd,earliest);

                }
                bolt.mesh.position.addScaledVector(velocity,dt);
                if(hit||bolt.mesh.position.z<ARENA.backZ-2||bolt.mesh.position.y<-.25||bolt.mesh.position.y>18) {
                    disposeMesh(bolt.mesh);laserBolts.splice(i,1);
                }
            }
        }

        function updateTiltControl(dt) {
            const maxPaddleX = ARENA.width - getPaddleHalfWidth();
            let tiltInput = 0;

            if (config.controlMode === 'tilt' && maxPaddleX > 0) {
                tiltInput = THREE.MathUtils.clamp(touchState.targetX / maxPaddleX, -1, 1);
            }

            const lerpAmt = Math.min(1, TILT_RESPONSE_RATE * dt);
            currentTiltAngle = THREE.MathUtils.lerp(currentTiltAngle, tiltInput * VISUAL_MAX_TILT_ANGLE, lerpAmt);
            currentTiltForce = THREE.MathUtils.lerp(currentTiltForce, tiltInput * MAX_LATERAL_ACCEL, lerpAmt);

            // Vertical gravity stays constant (normal fall/bounce timing); the tilt
            // adds an independent, strong horizontal pull so the ball's curve is
            // obvious even though the visual lean is subtle.
            world.gravity.set(currentTiltForce, -BASE_GRAVITY_MAGNITUDE, 0);
        }

        function handleKeyboardInput(dt) {
            const moveSpeed = 18.0;
            const maxPaddleX = ARENA.width - getPaddleHalfWidth();

            if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) {
                touchState.targetX = Math.max(-maxPaddleX, touchState.targetX - moveSpeed * dt);
            }
            if (keysPressed['ArrowRight'] || keysPressed['KeyD']) {
                touchState.targetX = Math.min(maxPaddleX, touchState.targetX + moveSpeed * dt);
            }
        }

        let cameraTrauma = 0;
        function triggerScreenShake(amount = 0.45) {
            cameraTrauma = Math.min(1.0, cameraTrauma + amount);
        }

        // Default (High) camera starts at the normal starting framing and rises a
        // little with every cube destroyed, reaching the Top-Down framing exactly
        // when the level's last breakable cube is gone. Low and explicit Top-Down
        // stay fixed, as before. Reset per level in spawnTargets().
        let levelBreakableTotal = 0;
        let blocksDestroyedThisLevel = 0;
        let cameraLevelProgressTarget = 0; // 0 = starting orientation, 1 = top-down (set instantly on destroy)
        let cameraLevelProgress = 0;       // eased copy actually used to place the camera
        const HIGH_CAM_POS = new THREE.Vector3(0, 23.5, 23.5);
        const HIGH_CAM_TARGET = new THREE.Vector3(0, 0, -2.5);
        const TOPDOWN_CAM_POS = new THREE.Vector3(0, 52, 4);
        const TOPDOWN_CAM_TARGET = new THREE.Vector3(0, 0, -3.5);

        // How gently the camera eases. Lower = smoother/slower, higher = snappier.
        const CAMERA_PROGRESS_SMOOTH_RATE = 1.1; // easing of the "how far up" amount itself
        const CAMERA_FOLLOW_RATE = 2.0;          // easing of position toward its target
        const CAMERA_LOOK_RATE = 2.0;            // easing of the look-at point toward its target
        const cameraLookCurrent = new THREE.Vector3(0, 0, -2.5);
        let cameraLookInitialized = false;

        // Exponential ease-in: early cubes barely move the camera, later cubes move
        // it a lot, with the last few producing the big jump up to top-down.
        function easeInExpo(t) {
            if (t <= 0) return 0;
            if (t >= 1) return 1;
            return Math.pow(2, 10 * (t - 1));
        }

        function updateCameraJuice(dt) {
            // Smoothly chase the destroy-driven progress value instead of snapping to it,
            // so every cube destroyed nudges the camera rather than jolting it.
            cameraLevelProgress += (cameraLevelProgressTarget - cameraLevelProgress) * Math.min(1, CAMERA_PROGRESS_SMOOTH_RATE * dt);
            const shapedCameraProgress = easeInExpo(cameraLevelProgress);

            if (config.camera === 'low') {
                cameraBasePos.set(0, 15.0, 29.0);
                cameraBaseTarget.set(0, 0.5, -5.0);
            } else if (config.camera === 'high') {
                cameraBasePos.lerpVectors(HIGH_CAM_POS, TOPDOWN_CAM_POS, shapedCameraProgress);
                cameraBaseTarget.lerpVectors(HIGH_CAM_TARGET, TOPDOWN_CAM_TARGET, shapedCameraProgress);
            } else if (config.camera === 'topdown') {
                // Top-down camera zoomed out to capture extended playfield
                cameraBasePos.set(0, 52, 4);
                cameraBaseTarget.set(0, 0, -3.5);
            }

            if (!cameraLookInitialized) {
                cameraLookCurrent.copy(cameraBaseTarget);
                cameraLookInitialized = true;
            }

            camera.position.lerp(cameraBasePos, Math.min(1, CAMERA_FOLLOW_RATE * dt));
            cameraLookCurrent.lerp(cameraBaseTarget, Math.min(1, CAMERA_LOOK_RATE * dt));

            if (cameraTrauma > 0) {
                const shakeX = (Math.random() - 0.5) * cameraTrauma * 0.7;
                const shakeY = (Math.random() - 0.5) * cameraTrauma * 0.7;
                camera.position.x += shakeX;
                camera.position.y += shakeY;
                cameraTrauma = Math.max(0, cameraTrauma - dt * 2.6);
            }

            camera.lookAt(cameraLookCurrent);
            camera.rotateZ(currentTiltAngle);
        }

        function updateCameraPosition() {

            camera.position.copy(cameraBasePos);

        function updateCameraAndFrustum() {
            const aspect = window.innerWidth / window.innerHeight;

            if (aspect < TARGET_PORTRAIT_ASPECT) {
                const hFOV = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_CAMERA_FOV) / 2) * TARGET_PORTRAIT_ASPECT);
                const newVFOV = 2 * Math.atan(Math.tan(hFOV / 2) / aspect);
                camera.fov = THREE.MathUtils.radToDeg(newVFOV);
            } else {
                camera.fov = BASE_CAMERA_FOV;
            }

            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            updateCameraPosition();
        }

        function disposeMesh(mesh) {
            if (!mesh) return;
            scene.remove(mesh);
            mesh.traverse(child => {
                if (child.isLight && child.dispose) child.dispose();
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.dispose());
                    } else {
                        child.material.dispose();
                    }
                }
            });
        }

        function disposeBall(b) {
            if (!b) return;
            if (b.shadowMesh) {
                scene.remove(b.shadowMesh);
                if (b.shadowMesh.geometry) b.shadowMesh.geometry.dispose();
                if (b.shadowMesh.material) b.shadowMesh.material.dispose();
            }
            if(b.trailGroup) {
                if(b.trailGroup.dispose) b.trailGroup.dispose();
                disposeMesh(b.trailGroup);
            }


            disposeMesh(b.mesh);
        }

        // Random per-stage floor/wall color, re-rolled every stage.
        let stageFloorColor = new THREE.Color(0xffffff);
        let stageWallColor = new THREE.Color(0xffffff);
        function rollStageColors() {
            stageFloorColor.setHSL(Math.random(), 0.40, 0.30);

        }

        // Rebuilds the satin-grid floor texture with a given base fill color, so the
        // per-stage floor color is baked into the texture itself (see buildArena()).
        function createSatinGridTexture(fillHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = fillHex;
            ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
            ctx.lineWidth = 3;
            for (let x = 0; x <= 512; x += 64) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
            }
            for (let y = 0; y <= 512; y += 64) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 18);
            return tex;
        }

        // Same idea for the speckled "textured" floor style.
        function createFloorSpeckleTexture(fillHex, r, g, b) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = fillHex;
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 40000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const val = Math.random() * 20 - 10;
                ctx.fillStyle = `rgba(${r + val}, ${g + val}, ${b + val}, 0.15)`;
                ctx.fillRect(x, y, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 18);
            return tex;
        }

        function buildArena() {

            const floorTint = stageFloorColor;
            const wallTint = stageWallColor;

            disposeMesh(platformBaseMesh);
            disposeMesh(leftWallMesh);

            if (config.walls !== 'invisible') {

        function handlePaddleHit(ballObj) {
            if (!paddle || isBallDocked || gameState !== 'PLAYING' || !ballObj || !ballObj.body) return false;
            const body = ballObj.body;
            const pos = body.position;
            const vel = body.velocity;

            // Only bounce if the ball is moving towards the paddle (vel.z > 0)
            if (vel.z <= 0) return false;

            const now = performance.now();
            if (simulationTime * 1000 - ballObj.lastHitTime < 60) return false;

            const paddleW = (paddle.userData && paddle.userData.width) || 3.8;
            const paddleD = (paddle.userData && paddle.userData.depth) || 0.86;
            const paddleH = (paddle.userData && paddle.userData.height) || 0.72;
            const hw = paddleW / 2;
            const frontZ = paddle.position.z - (paddleD / 2);
            const radius = ballObj.radius || 0.5;

            const relX = pos.x - paddle.position.x;
            const marginX = hw + radius * 0.85;
            if (Math.abs(relX) > marginX) return false;

            // Check if ball is in the contact zone along Z
            const contactZoneFront = frontZ - radius;
            const contactZoneBack = paddle.position.z + (paddleD / 2);
            if (pos.z < contactZoneFront - 0.5 || pos.z > contactZoneBack + 0.3) return false;

            ballObj.lastHitTime = simulationTime * 1000;

            // 1. Normalized hit offset across paddle width [-1.0 (left), 0 (center), +1.0 (right)]
            const normX = THREE.MathUtils.clamp(relX / hw, -1.0, 1.0);

            // 2. Direct Angular Deflection mapping (up to ~54 degrees)
            const maxAngle = Math.PI * 0.30;
            const hitAngle = normX * maxAngle;

            // 3. Exact Speed Preservation & Scoop Check
            const incomingSpeed = THREE.MathUtils.clamp(vel.length(), 24, 36);
            let outVx = Math.sin(hitAngle) * incomingSpeed;
            let outVz = -Math.abs(Math.cos(hitAngle) * incomingSpeed);

            const isScooped = lobQueued;
            let outVy = 0;
            if (isScooped) {
                const profile=getLobProfile(scoopPower);
                outVy=profile.verticalSpeed;
                outVx=Math.sin(hitAngle)*profile.horizontalSpeed;
                outVz=-Math.abs(Math.cos(hitAngle)*profile.horizontalSpeed);


                ballObj.isAirborne = true;
                ballObj.lobPower = scoopPower;
                pos.y = radius + 0.22; // Lift off ground contact threshold
                body.position.y = pos.y;
                soundFX.playScoop();

                // Persist visual chevron power for 1.4s so the player can clearly register the lob power
                lastLobDisplayUntil = now + 1400;
                lastLobPower = scoopPower;

                consumeLob(); // Consume one queued shot
            } else {
                ballObj.isAirborne = false;
                soundFX.playPaddleHit(normX);
            }

            // 4. Smooth Surface Alignment (place at the exact front striking face, NO artificial gap teleportation)
            pos.z = frontZ - radius;
            body.position.z = pos.z;
            body.velocity.set(outVx, outVy, outVz);

            // Synchronize visual mesh and trail smoothly
            if (ballObj.mesh) {
                ballObj.mesh.position.copy(body.position);
            }
            correctTrailHead(ballObj,body.position);
            if (ballObj.spin) ballObj.spin.set(0, 0, 0);

            // Reset combo streak on paddle return
            resetCombo();
            ballObj.consecutiveWallBounces = 0;

            // 5. Impact Effects
            const contactPoint = new THREE.Vector3(pos.x, paddle.position.y + 0.15, frontZ);
            createPaddleSparks(contactPoint);
            spawnShockwave(contactPoint, isScooped ? 0x22e5ff : 0x38bdf8);
            predictiveAimFlash = 1.0;

            return true;
        }

            // 4. Dots distributed along the actual (possibly bending) predicted

            const numDots = 10;
            const dotGeo = new THREE.SphereGeometry(0.095, 10, 10);
            predictiveAimDots = [];

            for (let i = 0; i < numDots; i++) {
                const dotMesh = new THREE.Mesh(dotGeo, predictiveAimMat);
                predictiveAimPointer.add(dotMesh);
                predictiveAimDots.push({
                    mesh: dotMesh,
                    index: i
                });
            }

            // 5. Continuous 3D laser trajectory line (arc trail)
            const lineGeo = new THREE.BufferGeometry();
            const maxLinePts = 24;
            const linePositions = new Float32Array(maxLinePts * 3);
            lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
            lineGeo.setDrawRange(0, 0);
            const lineMat = new THREE.LineBasicMaterial({
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const trajectoryLine = new THREE.Line(lineGeo, lineMat);
            trajectoryLine.frustumCulled = false;
            predictiveAimPointer.add(trajectoryLine);
            predictiveAimPointer.userData.trajectoryLine = trajectoryLine;

            predictiveAimPointer.visible = false;
            scene.add(predictiveAimPointer);
        }

        function findImpendingPaddleBall() {
            if (balls.length === 0 || !paddle) return null;
            const paddleD = (paddle.userData && paddle.userData.depth) || 0.86;
            const frontZ = paddle.position.z - (paddleD / 2);

            let bestBall = null;
            let minTime = Infinity;

            for (let i = 0; i < balls.length; i++) {
                const b = balls[i];
                if (!b || !b.body) continue;
                const pos = b.body.position;
                const vel = b.body.velocity;

                if (vel.z > 0.5 && pos.z < frontZ - 0.2) {
                    const timeToImpact = (frontZ - (b.radius || 0.5) - pos.z) / vel.z;
                    if (timeToImpact > 0 && timeToImpact < minTime) {
                        minTime = timeToImpact;
                        bestBall = b;
                    }
                }
            }
            return bestBall;
        }

        function getPredictedPaddleTrajectory(ballObj) {
            if (!ballObj || !ballObj.body || !paddle) return null;
            const pos = ballObj.body.position;
            const vel = ballObj.body.velocity;
            if (vel.z <= 0) return null;

            const paddleW = (paddle.userData && paddle.userData.width) || 3.8;
            const paddleD = (paddle.userData && paddle.userData.depth) || 0.86;
            const frontZ = paddle.position.z - (paddleD / 2);
            const radius = ballObj.radius || 0.5;
            const targetZ = frontZ - radius;
            const distZ = targetZ - pos.z;
            if (distZ <= 0) return null;

            const boundX = ARENA.width - radius;
            const halfBlock = 0.41; // matches bounceBallOffBlock's blockSize/2
            const blockExt = halfBlock + radius; // Minkowski-expanded half-extent for ray-vs-box

            let curX = pos.x;
            let curZ = pos.z;
            let curVx = vel.x;
            let curVz = vel.z;

            const points = [{ x: curX, z: curZ }];

            let blockBounced = false;
            let reachedPaddle = false;
            let steps = 14; // combined wall + one block bounce budget

            while (steps-- > 0) {
                if (curVz <= 0.0001) break; // stalled or bounced back away from paddle

                const distToTarget = targetZ - curZ;
                if (distToTarget <= 0) { reachedPaddle = true; break; }
                const timeToTarget = distToTarget / curVz;

                let timeToWall = Infinity;
                if (curVx > 0.0001) timeToWall = (boundX - curX) / curVx;
                else if (curVx < -0.0001) timeToWall = (-boundX - curX) / curVx;

                let nextT = Math.min(timeToTarget, timeToWall);
                let eventType = (nextT === timeToTarget) ? 'paddle' : 'wall';
                let hitTarget = null;

                // Nearest block in the way (only checked until the first bend)
                if (!blockBounced) {
                    let blockHitT = Infinity;
                    let blockHitTarget = null;

                    for (let i = 0; i < targets.length; i++) {
                        const tgt = targets[i];
                        if (!tgt.body || tgt.isDestroying) continue;
                        const bx = tgt.body.position.x;
                        const bz = tgt.body.position.z;
                        targetBounds(tgt);
                        const extX=(tgt.body.aabb.upperBound.x-tgt.body.aabb.lowerBound.x)/2+radius;
                        const extZ=(tgt.body.aabb.upperBound.z-tgt.body.aabb.lowerBound.z)/2+radius;

                        let tMinX = -Infinity, tMaxX = Infinity;
                        if (Math.abs(curVx) < 1e-6) {
                            if (curX < bx - extX || curX > bx + extX) continue;
                        } else {
                            const t1 = (bx - extX - curX) / curVx;
                            const t2 = (bx + extX - curX) / curVx;
                            tMinX = Math.min(t1, t2);
                            tMaxX = Math.max(t1, t2);
                        }

                        let tMinZ = -Infinity, tMaxZ = Infinity;
                        if (Math.abs(curVz) < 1e-6) {
                            if (curZ < bz - extZ || curZ > bz + extZ) continue;
                        } else {
                            const t1 = (bz - extZ - curZ) / curVz;
                            const t2 = (bz + extZ - curZ) / curVz;
                            tMinZ = Math.min(t1, t2);
                            tMaxZ = Math.max(t1, t2);
                        }

                        const tEntry = Math.max(tMinX, tMinZ, 0.0001);
                        const tExit = Math.min(tMaxX, tMaxZ);

                        if (tEntry <= tExit && tEntry < blockHitT && tEntry < nextT) {
                            blockHitT = tEntry;
                            blockHitTarget = tgt;
                        }
                    }

                    if (blockHitTarget) {
                        nextT = blockHitT;
                        eventType = 'block';
                        hitTarget = blockHitTarget;
                    }
                }

                curX += curVx * nextT;
                curZ += curVz * nextT;
                points.push({ x: curX, z: curZ });

                if (eventType === 'paddle') {
                    reachedPaddle = true;
                    break;
                } else if (eventType === 'wall') {
                    curVx = -curVx;
                } else if (eventType === 'block') {
                    blockBounced = true;
                    // Same dominant-axis rule as bounceBallOffBlock, so the
                    // predicted bend matches the real collision response.
                    const dx = curX - hitTarget.body.position.x;
                    const dz = curZ - hitTarget.body.position.z;
                    if (Math.abs(dz) >= Math.abs(dx)) {
                        curVz = dz >= 0 ? Math.abs(curVz) : -Math.abs(curVz);
                    } else {
                        curVx = dx >= 0 ? Math.abs(curVx) : -Math.abs(curVx);
                    }
                }
            }

            if (!reachedPaddle) return null;

            curX = THREE.MathUtils.clamp(curX, -boundX, boundX);
            points[points.length - 1].x = curX;

            const hw = paddleW / 2;
            const relX = curX - paddle.position.x;
            const margin = hw + radius * 0.85;
            const isInRange = Math.abs(relX) <= margin;

            // Direct Angular Deflection mapping (exact match with handlePaddleHit)
            const normX = THREE.MathUtils.clamp(relX / hw, -1.0, 1.0);
            const maxAngle = Math.PI * 0.30;
            const hitAngle = normX * maxAngle;
            const yaw = -hitAngle;

            return {
                points: points,
                impactX: curX,
                frontZ: frontZ,
                distZ: distZ,
                relX: relX,
                isInRange: isInRange,
                yaw: yaw,
                normX: normX
            };
        }

        // Walk backward along a polyline (ball -> ... -> paddle) by arc length,
        // returning the interpolated point, or null if dist exceeds the path.
        function pointAtArcLengthFromEnd(points, dist) {
            let remaining = dist;
            for (let i = points.length - 1; i > 0; i--) {
                const a = points[i];
                const b = points[i - 1];
                const segLen = Math.hypot(a.x - b.x, a.z - b.z);
                if (segLen >= remaining) {
                    const t = segLen > 0.0001 ? remaining / segLen : 0;
                    return { x: a.x + (b.x - a.x) * t, z: a.z + (b.z - a.z) * t };
                }
                remaining -= segLen;
            }
            return null;
        }

        // Walk forward along a polyline (paddle -> ... -> outfield) by arc length,
        // returning the interpolated point, or null if dist exceeds the path.
        function pointAtArcLengthFromStart(points, dist) {
            let remaining = dist;
            for (let i = 0; i < points.length - 1; i++) {
                const a = points[i];
                const b = points[i + 1];
                const segLen = Math.hypot(b.x - a.x, b.z - a.z);
                if (segLen >= remaining) {
                    const t = segLen > 0.0001 ? remaining / segLen : 0;
                    return { x: a.x + (b.x - a.x) * t, z: a.z + (b.z - a.z) * t };
                }
                remaining -= segLen;
            }
            return null;
        }

        // Simulate the ball's path AFTER it leaves the paddle (mirrors handlePaddleHit's
        // exact angular-deflection formula), including side-wall bounces, so the aim
        // dots show where the ball is headed next rather than where it came from.
        function getPredictedOutgoingPath(startX, startZ, vx, vz, radius, maxLen) {
            const boundX = ARENA.width - radius;
            let curX = startX, curZ = startZ, curVx = vx, curVz = vz;
            const points = [{ x: curX, z: curZ }];
            let remaining = maxLen;
            let steps = 8;

            while (steps-- > 0 && remaining > 0.0001) {
                const speed = Math.hypot(curVx, curVz) || 0.0001;
                let timeToWall = Infinity;
                if (curVx > 0.0001) timeToWall = (boundX - curX) / curVx;
                else if (curVx < -0.0001) timeToWall = (-boundX - curX) / curVx;
                const distToWall = timeToWall * speed;

                if (distToWall < remaining - 0.0001) {
                    // Path bends off a side wall before running out of length
                    curX += curVx * timeToWall;
                    curZ += curVz * timeToWall;
                    points.push({ x: curX, z: curZ });
                    remaining -= distToWall;
                    curVx = -curVx;
                } else {
                    // Path ends within this final segment
                    const t = remaining / speed;
                    curX += curVx * t;
                    curZ += curVz * t;
                    points.push({ x: curX, z: curZ });
                    remaining = 0;
                }
            }
            return points;
        }

        const PREDICTIVE_AIM_DOT_SPACING = 0.90;

        function updatePredictiveAimPointer(rawDt) {
            if (!predictiveAimPointer || !predictiveAimMat) return;
            const ring = predictiveAimPointer.userData.ring;

            if (gameState !== 'PLAYING' || !paddle) {
                predictiveAimPointer.visible = false;
                return;
            }

            // Remove the pathfinder UI when lobbing (per user request)
            const isAimScooped = lobQueued;
            if (isAimScooped) {
                predictiveAimPointer.visible = false;
                if (predictiveAimPointer.userData.chargeRing) predictiveAimPointer.userData.chargeRing.visible = false;
                if (predictiveAimPointer.userData.apexRing) predictiveAimPointer.userData.apexRing.visible = false;
                if (predictiveAimPointer.userData.trajectoryLine) {
                    predictiveAimPointer.userData.trajectoryLine.visible = false;
                    predictiveAimPointer.userData.trajectoryLine.geometry.setDrawRange(0, 0);
                }
                for (let i = 0; i < predictiveAimDots.length; i++) {
                    predictiveAimDots[i].mesh.visible = false;
                }
                return;
            }

            const paddleD = (paddle.userData && paddle.userData.depth) || 0.86;
            const frontZ = paddle.position.z - (paddleD / 2);
            const now = performance.now();

            // Fallback used whenever there's no valid ball trajectory to track (ball just
            // left the paddle, or isn't in range yet) but a recent-impact flash is still
            // fading out. Re-anchors to the paddle's CURRENT position every frame so the
            // glow follows a fast-moving paddle instead of being left behind at the spot
            // of the last hit.
            function decayFlashAtPaddle() {
                if (predictiveAimFlash > 0) {
                    predictiveAimFlash -= rawDt * 4.0;
                    if (predictiveAimFlash < 0) predictiveAimFlash = 0;
                    predictiveAimMat.opacity = predictiveAimFlash * 0.95;
                    predictiveAimPointer.visible = predictiveAimFlash > 0.01;
                    if (predictiveAimPointer.visible) {
                        ring.position.set(paddle.position.x, 0.22, frontZ);
                        ring.rotation.y = 0;
                        if (predictiveAimPointer.userData.chargeRing) predictiveAimPointer.userData.chargeRing.visible = false;
                        if (predictiveAimPointer.userData.apexRing) predictiveAimPointer.userData.apexRing.visible = false;
                        if (predictiveAimPointer.userData.trajectoryLine) predictiveAimPointer.userData.trajectoryLine.geometry.setDrawRange(0, 0);
                        for (let i = 0; i < predictiveAimDots.length; i++) {
                            predictiveAimDots[i].mesh.visible = false;
                        }
                    }
                } else {
                    predictiveAimPointer.visible = false;
                    if (predictiveAimPointer.userData.chargeRing) predictiveAimPointer.userData.chargeRing.visible = false;
                    if (predictiveAimPointer.userData.apexRing) predictiveAimPointer.userData.apexRing.visible = false;
                    if (predictiveAimPointer.userData.trajectoryLine) predictiveAimPointer.userData.trajectoryLine.geometry.setDrawRange(0, 0);
                }
            }

            // 1. Docked ball state (preparing to serve)
            if (isBallDocked) {
                predictiveAimPointer.visible = true;
                ring.position.set(paddle.position.x, 0.22, frontZ);
                ring.rotation.y = 0;
                if (predictiveAimPointer.userData.chargeRing) predictiveAimPointer.userData.chargeRing.visible = false;
                if (predictiveAimPointer.userData.apexRing) predictiveAimPointer.userData.apexRing.visible = false;
                if (predictiveAimPointer.userData.trajectoryLine) predictiveAimPointer.userData.trajectoryLine.geometry.setDrawRange(0, 0);

                predictiveAimMat.color.setHex(0x00f0ff);
                const pulse = 0.65 + Math.sin(now * 0.006) * 0.25;
                predictiveAimMat.opacity = pulse;

                // Animate dots with a smooth pulsing wave, straight out from the paddle
                for (let i = 0; i < predictiveAimDots.length; i++) {
                    const d = predictiveAimDots[i];
                    d.mesh.visible = true;
                    d.mesh.position.set(paddle.position.x, 0.22, frontZ - PREDICTIVE_AIM_DOT_SPACING * (i + 1));
                    const wave = (Math.sin(now * 0.007 - i * 0.45) + 1) * 0.5;
                    const s = 0.75 + wave * 0.45;
                    d.mesh.scale.set(s, s, s);
                }
                return;
            }

            // 2. Active game: find incoming ball
            const impendingBall = findImpendingPaddleBall();

            if (!impendingBall) {
                decayFlashAtPaddle();
                return;
            }

            const traj = getPredictedPaddleTrajectory(impendingBall);
            if (!traj) {
                predictiveAimPointer.visible = false;
                return;
            }

            // ONLY appear when the ball has actually a chance of hitting the paddle
            if (!traj.isInRange || traj.distZ > 22.0) {
                decayFlashAtPaddle();
                return;
            }

            predictiveAimPointer.visible = true;

            // Ring sits at the projected impact point on the paddle's front strike plane
            ring.position.set(traj.impactX, 0.22, traj.frontZ);
            ring.rotation.y = traj.yaw;

            // Determine pointer theme
            let baseColorHex = 0x00f0ff;
            if (isFireballActive) {
                baseColorHex = 0xff4500;
            } else if (isSlowMoActive) {
                baseColorHex = 0x38bdf8;
            } else if (currentCombo >= 5) {
                const tier = getComboTierInfo(currentCombo);
                baseColorHex = parseInt(tier.color.replace('#', '0x'));
            }

            let aimColor = new THREE.Color(baseColorHex);
            predictiveAimMat.color.copy(aimColor);

            const chargeRing = predictiveAimPointer.userData.chargeRing;
            if (chargeRing) chargeRing.visible = false;
            const apexRing = predictiveAimPointer.userData.apexRing;
            if (apexRing) apexRing.visible = false;

            // Opacity scales up as the ball gets closer to the paddle
            const distFade = THREE.MathUtils.clamp(1.0 - (traj.distZ / 22.0), 0.45, 0.95);
            predictiveAimMat.opacity = Math.max(distFade, predictiveAimFlash);

            // Distribute dots forward along the ball's post-bounce path (paddle -> outfield,
            // with any side-wall bends) so they show where the ball is headed NEXT,
            // rather than the path it's arriving from.
            const radius = impendingBall.radius || 0.5;
            const incomingSpeed = THREE.MathUtils.clamp(impendingBall.body.velocity.length(), 24, 36);
            const maxAngle = Math.PI * 0.30;
            const hitAngle = traj.normX * maxAngle;
            const outVx = Math.sin(hitAngle) * incomingSpeed;
            const outVz = -Math.abs(Math.cos(hitAngle) * incomingSpeed);
            const outStartZ = traj.frontZ - radius;
            const maxOutgoingLen = PREDICTIVE_AIM_DOT_SPACING * (predictiveAimDots.length + 1);
            const outgoingPoints = getPredictedOutgoingPath(traj.impactX, outStartZ, outVx, outVz, radius, maxOutgoingLen);

            const speedScale = THREE.MathUtils.clamp(incomingSpeed / 20.0, 1.0, 2.5);

            // Cascade the dots in one at a time, starting closest to the paddle,
            // as the incoming ball closes the distance
            const proximity = THREE.MathUtils.clamp(1.0 - (traj.distZ / 22.0), 0, 1);
            const revealCount = proximity * predictiveAimDots.length;

            for (let i = 0; i < predictiveAimDots.length; i++) {
                const d = predictiveAimDots[i];
                const dotReveal = THREE.MathUtils.clamp(revealCount - i, 0, 1);

                if (dotReveal <= 0.001) {
                    d.mesh.visible = false;
                    continue;
                }

                const dotSpacing = PREDICTIVE_AIM_DOT_SPACING;
                const p = pointAtArcLengthFromStart(outgoingPoints, dotSpacing * (i + 1));

                if (!p) {
                    d.mesh.visible = false;
                    continue;
                }

                d.mesh.visible = true;
                d.mesh.position.set(p.x, 0.22, p.z);

                const wave = (Math.sin(now * 0.008 * speedScale - i * 0.45) + 1) * 0.5;
                const taper = 1.0 - (i / predictiveAimDots.length) * 0.28;
                const s = (0.80 + wave * 0.40) * taper * dotReveal;
                d.mesh.scale.set(s, s, s);
            }

            const trajectoryLine = predictiveAimPointer.userData.trajectoryLine;
            if (trajectoryLine) {
                trajectoryLine.visible = false;
                trajectoryLine.geometry.setDrawRange(0, 0);
            }

            if (predictiveAimFlash > 0) {
                predictiveAimFlash -= rawDt * 4.0;
                if (predictiveAimFlash < 0) predictiveAimFlash = 0;
            }
        }

        function spawnBall(customPos = null, customVel = null) {
            const radius = 0.5;
            const geo = new THREE.SphereGeometry(radius, 32, 32);

            let mat;
            if (config.ball === 'black' || config.ball === 'gray') {
                mat = new THREE.MeshStandardMaterial({
                    color: 0x050508, // Rich deep glossy obsidian black
                    roughness: 0.12,
                    metalness: 0.18,
                    envMap: chromeEnvTexture,
                    envMapIntensity: 0.40
                });
            } else if (config.ball === 'chrome') {
                mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.02, metalness: 1.0, envMap: chromeEnvTexture, envMapIntensity: 1.8 });
            } else if (config.ball === 'purple') {
                mat = new THREE.MeshStandardMaterial({ color: 0xa855f7, emissive: 0xa855f7, emissiveIntensity: 0.6, roughness: 0.2, metalness: 0.3 });
            }

            const mesh = new THREE.Mesh(geo, mat);

            if (config.ball === 'purple') {
                const purplePointLight = new THREE.PointLight(0xa855f7, 3.5, 12.0);
                purplePointLight.position.set(0, 0, 0);
                mesh.add(purplePointLight);
            }

            const spawnX = customPos ? customPos.x : 0;
            const spawnY = customPos ? customPos.y : 0.6;
            const spawnZ = customPos ? customPos.z : ARENA.paddleZ - 2;

            mesh.position.set(spawnX, spawnY, spawnZ);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const trailGroup=createBallTrail(mesh.position);
            const trailData=createTrailHistory(mesh.position);


            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({
                mass: 0.85,
                shape: shape,
                material: physicsMaterials.ball,
                linearDamping: 0.0,
                angularDamping: 0.0 // Collision accuracy comes from the fixed 120 Hz steps.
            });
            body.position.set(spawnX, spawnY, spawnZ);

            if (customVel) {
                body.velocity.copy(customVel);
            } else {
                body.velocity.set((Math.random() - 0.5) * 4, 0.0, -24);
            }

            // Dedicated dynamic ground contact shadow for the ball
            const shadowGeo = new THREE.CircleGeometry(radius * 0.95, 20);
            shadowGeo.rotateX(-Math.PI / 2);
            const shadowMat = new THREE.MeshBasicMaterial({
                color: 0x020208,
                transparent: true,
                opacity: 0.60,
                depthWrite: false
            });
            const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
            shadowMesh.position.set(spawnX, 0.02, spawnZ);
            scene.add(shadowMesh);

            const ballObj = { 
                mesh, 
                body, 
                radius, 
                shadowMesh,
                trailGroup, 
                trailData, 
                spin: new THREE.Vector3(0, 0, 0),
                lastHitTime: 0 
            };

            body.addEventListener("collide", (e) => {
                if (e.body === paddleBody) {
                    handlePaddleHit(ballObj);
                } else if (e.body.material === physicsMaterials.ball) {
                    const now = performance.now();
                    if (simulationTime * 1000 - ballObj.lastHitTime < 70) return;
                    ballObj.lastHitTime = simulationTime * 1000;

                    const contactPoint = new THREE.Vector3(
                        (body.position.x + e.body.position.x) / 2,
                        (body.position.y + e.body.position.y) / 2,
                        (body.position.z + e.body.position.z) / 2
                    );
                    createPaddleSparks(contactPoint);
                    spawnShockwave(contactPoint, 0x38bdf8);
                    soundFX.playPaddleHit(0);
                } else if (e.body && e.body.material === physicsMaterials.wall) {
                    // Wall bounce is handled with exact specular physics in updateGameLogic
                } else if (e.body && (e.body.material === physicsMaterials.floor || e.body === floorBody)) {
                    if (body.velocity.y <= 0) {
                        if (ballObj.isAirborne && body.velocity.y < -1.5) {
                            soundFX.playBallLand();
                            spawnShockwave(new THREE.Vector3(body.position.x, 0.04, body.position.z), 0x22e5ff);
                            ballObj.isAirborne = false;
                        }
                        body.velocity.y = 0;
                    }
                }
            });

            world.addBody(body);
            // Orange fireball light: created up front (dark) so toggling it never changes the scene's light count.
            const fireLight = new THREE.PointLight(0xff7a1a, 0, 6, 2);
            fireLight.castShadow = false;
            mesh.add(fireLight);
            ballObj.fireLight = fireLight;

            balls.push(ballObj);
            updateBallVisuals();
        }

        const trailColorWhite = new THREE.Color(0xffffff);
        const trailColorTeal = new THREE.Color(0x00f5d4);
        const trailColorBlue = new THREE.Color(0x0055ff);
        const trailColorBlack = new THREE.Color(0x000000);

        const fbColorWhite = new THREE.Color(0xffffff);
        const fbColorYellow = new THREE.Color(0xffdd00);
        const fbColorRed = new THREE.Color(0xff2200);
        const fbColorBlack = new THREE.Color(0x000000);

        function updateBallTrails(dt) {
            updateBatchedBallTrails(dt);
        }

        // Fireball look: glowing orange core fading to red at the silhouette (fresnel), plus an orange point light.
        function createFireShell(radius) {
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } },
                vertexShader: `
                    varying vec3 vN; varying vec3 vV;
                    void main() {
                        vec4 mv = modelViewMatrix * vec4(position, 1.0);
                        vN = normalize(normalMatrix * normal);
                        vV = normalize(-mv.xyz);
                        gl_Position = projectionMatrix * mv;
                    }`,
                fragmentShader: `
                    varying vec3 vN; varying vec3 vV; uniform float uTime;
                    void main() {
                        float facing = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
                        float edge = smoothstep(0.0, 1.0, pow(1.0 - facing, 1.5));
                        vec3 orange = vec3(1.0, 0.72, 0.18);
                        vec3 red = vec3(1.0, 0.16, 0.02);
                        vec3 col = mix(orange, red, edge);
                        col *= 1.3 + 0.12 * sin(uTime * 14.0 + edge * 4.0);
                        gl_FragColor = vec4(col, 1.0);
                    }`
            });
            const shell = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.004, 32, 32), mat);
            shell.castShadow = false;
            shell.receiveShadow = false;
            return shell;
        }

        function updateBallVisuals(dt = 0) {
            const t = performance.now() * 0.001;
            for (const b of balls) {
                if (isFireballActive && !b.fireShell) {
                    b.fireShell = createFireShell(b.radius || 0.5);
                    b.mesh.add(b.fireShell);
                }
                if (b.fireShell) {
                    b.fireShell.visible = isFireballActive;
                    b.fireShell.material.uniforms.uTime.value = t;
                }
                // Pong level: a plain flat-white ball.
                const pong = isPongLevel();
                if (pong && !b.pongShell) {
                    // toneMapped:false - the renderer's ACES tone mapping otherwise dims white to ~80% (light gray).
                    // fog:false - keeps distance fog from tinting it.
                    b.pongShell = new THREE.Mesh(new THREE.SphereGeometry((b.radius || 0.5) * 1.004, 32, 32),
                        new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false, fog: false }));
                    b.mesh.add(b.pongShell);
                }
                if (b.pongShell) b.pongShell.visible = pong && !isFireballActive;
                // A burning (or pong) ball is pure emission: hide the glossy base ball (no shine) and drop every shadow.
                const flat = isFireballActive || pong;
                b.mesh.material.visible = !flat;
                b.mesh.castShadow = !flat;
                if (b.shadowMesh) b.shadowMesh.visible = !flat;
                if (b.fireLight) {
                    b.fireLight.intensity = isFireballActive
                        ? 7 + Math.sin(t * 23) * 1.2 + Math.sin(t * 41) * 0.8
                        : 0;
                }
            }
        }

        function updateFireballFX(dt) {
            if (!isFireballActive) return;
            balls.forEach(b => {
                if (Math.random() < 0.65) {
                    const emberGeo = new THREE.SphereGeometry(0.12, 6, 6);
                    const emberMat = new THREE.MeshBasicMaterial({
                        color: Math.random() < 0.5 ? 0xff3b00 : 0xffaa00,
                        transparent: true,
                        opacity: 0.95,
                        blending: THREE.AdditiveBlending
                    });
                    const emberMesh = new THREE.Mesh(emberGeo, emberMat);
                    emberMesh.position.copy(b.mesh.position);
                    emberMesh.position.x += (Math.random() - 0.5) * 0.4;
                    emberMesh.position.y += (Math.random() - 0.5) * 0.4;
                    emberMesh.position.z += (Math.random() - 0.5) * 0.4;
                    scene.add(emberMesh);
                    flameEmbers.push({
                        mesh: emberMesh,
                        life: 0.35,
                        maxLife: 0.35,
                        vel: new THREE.Vector3((Math.random() - 0.5) * 2.5, Math.random() * 2.5 + 0.8, (Math.random() - 0.5) * 2.5)
                    });
                }
            });
        }

        function updateFlameEmbers(dt) {
            for (let i = flameEmbers.length - 1; i >= 0; i--) {
                const em = flameEmbers[i];
                em.life -= dt;
                em.mesh.position.addScaledVector(em.vel, dt);
                const progress = Math.max(0, em.life / em.maxLife);
                em.mesh.material.opacity = progress * 0.9;
                em.mesh.scale.setScalar(progress);
                if (em.life <= 0) {
                    disposeMesh(em.mesh);
                    flameEmbers.splice(i, 1);
                }
            }
        }

        function shootLaser() { fireAlignedLasers(); }

        function activateShield() {
            isShieldActive = true;
            shieldHitsLeft = 2;
            powerUpTimers.SHIELD.remaining = powerUpTimers.SHIELD.total;
            showNotification('Safety Shield Deployed (2 Saves)');

            if (shieldMesh) {
                disposeMesh(shieldMesh);
                shieldMesh = null;
            }

            const shieldW = ARENA.width * 2.2;
            const shieldH = ARENA.height * 0.85;
            const shieldGeo = new THREE.PlaneGeometry(shieldW, shieldH, 16, 8);
            const shieldMat = new THREE.MeshStandardMaterial({
                color: 0x10b981,
                emissive: 0x059669,
                emissiveIntensity: 0.9,
                transparent: true,
                opacity: 0.55,
                roughness: 0.1,
                metalness: 0.8,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
            shieldMesh.position.set(0, shieldH / 2, ARENA.paddleZ + 2.2);
            scene.add(shieldMesh);
        }

        function deactivateShield() {
            isShieldActive = false;
            shieldHitsLeft = 0;
            powerUpTimers.SHIELD.remaining = 0;
            if (shieldMesh) {
                disposeMesh(shieldMesh);
                shieldMesh = null;
            }
        }

        function updateShield(dt) {
            if (!isShieldActive || !shieldMesh) return;

            const pulse = 0.40 + Math.sin(performance.now() * 0.005) * 0.18;
            shieldMesh.material.opacity = pulse;

            for (let i = 0; i < balls.length; i++) {
                const b = balls[i];
                const pos = b.body.position;
                const vel = b.body.velocity;

                if (pos.z >= ARENA.paddleZ + 1.6 && pos.z <= ARENA.paddleZ + 2.8 && vel.z > 0) {
                    pos.z = ARENA.paddleZ + 1.4;
                    b.body.position.z = pos.z;
                    vel.z = -Math.max(Math.abs(vel.z), 24.0);
                    vel.x += (Math.random() - 0.5) * 8.0 - (pos.x * 0.5);

                    soundFX.playShieldBounce();
                    triggerScreenShake(0.35);
                    resetCombo();

                    const hitPt = new THREE.Vector3(pos.x, Math.max(pos.y, 0.5), ARENA.paddleZ + 2.1);
                    spawnShockwave(hitPt, 0x10b981);
                    createPaddleSparks(hitPt);

                    shieldHitsLeft--;
                    if (shieldHitsLeft > 0) {
                        showNotification(`Shield Saved Ball (${shieldHitsLeft} left)`);
                    } else {
                        showNotification('Shield Exhausted');
                        deactivateShield();
                        break;
                    }
                }
            }
        }

        const POWERUP_WEIGHTS = {
            MULTIBALL: 18,
            WIDE_PADDLE: 18,
            FIREBALL: 16,
            SLOW_MO: 16,
            LASER_PADDLE: 16,
            SHIELD: 10,
            EXTRA_LIFE: 6
        };

        function isPowerUpActive(type) {
            // Multi-Ball is permitted to continue spawning at all times
            if (type === 'MULTIBALL') {
                return false;
            }

            // Check if this power-up type is already in the arena awaiting collection
            if (powerUps.some(p => p.type === type)) {
                return true;
            }

            // Check if the power-up effect is currently active on the player
            switch (type) {
                case 'FIREBALL':
                    return Boolean(isFireballActive || (powerUpTimers.FIREBALL && powerUpTimers.FIREBALL.remaining > 0));
                case 'WIDE_PADDLE':
                    return Boolean(paddleWidthMultiplier > 1.0 || isWidePaddleActive || (powerUpTimers.WIDE_PADDLE && powerUpTimers.WIDE_PADDLE.remaining > 0));
                case 'SLOW_MO':
                    return Boolean(isSlowMoActive || (powerUpTimers.SLOW_MO && powerUpTimers.SLOW_MO.remaining > 0));
                case 'LASER_PADDLE':
                    return Boolean(isLaserPaddleActive || (powerUpTimers.LASER_PADDLE && powerUpTimers.LASER_PADDLE.remaining > 0));
                case 'SHIELD':
                    return Boolean(isShieldActive || shieldHitsLeft > 0 || (powerUpTimers.SHIELD && powerUpTimers.SHIELD.remaining > 0));
                case 'EXTRA_LIFE':
                    return lives >= MAX_LIVES;
                default:
                    return false;
            }
        }

        // Power-up pickup art: glowing core + one ring + a floating icon badge.
        const powerUpIconCache = {};
        function getPowerUpIconTexture(type, colorHex) {
            if (powerUpIconCache[type]) return powerUpIconCache[type];
            const size = 128, c = document.createElement('canvas');
            c.width = c.height = size;
            const g = c.getContext('2d');
            const hex = '#' + new THREE.Color(colorHex).getHexString();
            // Badge: dark disc, thick colored rim, soft outer glow.
            g.shadowColor = hex; g.shadowBlur = 14;
            g.fillStyle = 'rgba(8,10,20,0.92)';
            g.beginPath(); g.arc(64, 64, 52, 0, Math.PI * 2); g.fill();
            g.shadowBlur = 0;
            g.lineWidth = 8; g.strokeStyle = hex;
            g.beginPath(); g.arc(64, 64, 52, 0, Math.PI * 2); g.stroke();
            g.fillStyle = '#ffffff'; g.strokeStyle = '#ffffff';
            g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round';

            if (type === 'MULTIBALL') {
                for (const [x, y] of [[64,44],[46,78],[82,78]]) { g.beginPath(); g.arc(x, y, 13, 0, Math.PI * 2); g.fill(); }
            } else if (type === 'WIDE_PADDLE') {
                g.fillRect(44, 58, 40, 13);
                tri(38,64.5, 22,50, 22,79); tri(90,64.5, 106,50, 106,79);
            } else if (type === 'EXTRA_LIFE') {
                g.beginPath(); g.moveTo(64,92);
                g.bezierCurveTo(30,68, 34,36, 55,40); g.bezierCurveTo(60,41, 63,45, 64,49);
                g.bezierCurveTo(65,45, 68,41, 73,40); g.bezierCurveTo(94,36, 98,68, 64,92); g.fill();
            } else if (type === 'FIREBALL') {
                g.beginPath(); g.moveTo(64,26);
                g.bezierCurveTo(74,44, 92,52, 90,74); g.bezierCurveTo(88,92, 40,96, 38,74);
                g.bezierCurveTo(37,62, 46,58, 50,48); g.bezierCurveTo(54,56, 58,54, 58,46);
                g.bezierCurveTo(58,38, 62,32, 64,26); g.fill();
            } else if (type === 'SLOW_MO') {
                g.beginPath(); g.arc(64, 66, 27, 0, Math.PI * 2); g.stroke();
                g.beginPath(); g.moveTo(64,66); g.lineTo(64,49); g.moveTo(64,66); g.lineTo(77,72); g.stroke();
                g.fillRect(58, 28, 12, 7);
            } else if (type === 'LASER_PADDLE') {
                g.beginPath(); g.moveTo(46,90); g.lineTo(46,44); g.moveTo(82,90); g.lineTo(82,44); g.stroke();
                tri(46,26, 36,46, 56,46); tri(82,26, 72,46, 92,46);

                g.bezierCurveTo(90,80, 78,90, 64,98); g.bezierCurveTo(50,90, 38,80, 36,64);
                g.lineTo(34,38); g.closePath(); g.fill();
